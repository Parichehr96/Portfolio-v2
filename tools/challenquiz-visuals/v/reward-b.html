<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="A waterfall of Lena's payout: +288 for eight answers, −6 for a hint, +12 for third place makes 294; minus the 200 entry leaves +94. A faint line marks the 396 maximum.">
<title>Challenquiz — result (B)</title>
<link rel="stylesheet" href="cq.css">
<script src="cq.js"></script>
<style>
  .canvas { height: 380px; padding: 22px 26px 0; }
  .t { font: 600 15px/1 "Figtree"; } .s { font: 400 12px/1 "Figtree"; color: var(--pg-muted); margin-top: 6px; }
  svg { display: block; margin-top: 12px; overflow: visible; }
  .bar { transition: transform .7s var(--ease); transform-box: fill-box; transform-origin: bottom; transform: scaleY(0); }
  .bar.neg { transform-origin: top; } .is-in .bar { transform: none; }
  .vl { font: 600 12px "Figtree"; fill: #0D1233; } .xl { font: 500 11px "Figtree"; fill: #475569; } .gl { font: 400 11px "Figtree"; fill: #475569; }
  .tip { position: absolute; pointer-events: none; background: #0D1233; color: #fff; font: 500 11px/1.3 "Figtree"; padding: 6px 8px; border-radius: 8px; opacity: 0; transition: opacity .15s; }
</style></head><body>
<div class="frame frame--white" id="f"><div class="canvas" id="c"><div class="t">Why 294 and not 396</div><div class="s">Lena's game, in CQ · 8 of 10 correct, one hint charged, third of ten</div>
  <svg id="g" width="548" height="290"></svg><div class="tip" id="tip"></div></div></div>
<script>
  /* [label, delta, kind] kind: up/down/total */
  var D = [["Answers", 288, "up", "8 correct × 36"], ["Hint", -6, "down", "Q9: 36 → 30 (Q1's hint was free, the answer was wrong)"], ["Placement", 12, "up", "3rd of 10"],
           ["Payout", 294, "total", "lands in her wallet"], ["Entry", -200, "down", "paid to take the seat"], ["This game", 94, "total", "net"]];
  var H = 230, Y = function (v) { return H - v * (H - 20) / 400; }, bw = 56, gap = 34, x0 = 30, run = 0, s = "";
  s += '<line x1="0" x2="548" y1="' + Y(396) + '" y2="' + Y(396) + '" stroke="#B8ABDA" stroke-dasharray="4 5"/><text class="gl" x="548" y="' + (Y(396) - 6) + '" text-anchor="end">396, the most a game can pay</text>';
  s += '<line x1="0" x2="548" y1="' + Y(0) + '" y2="' + Y(0) + '" stroke="#E2E8F0"/>';
  D.forEach(function (d, i) {
    var x = x0 + i * (bw + gap), a, b, col;
    if (d[2] === "total") { a = 0; b = d[1]; run = d[1]; col = "#5425A0"; } else { a = run; b = run + d[1]; run = b; col = d[1] < 0 ? "#D22E2D" : "#865BEE"; }
    var top = Y(Math.max(a, b)), h = Math.max(2, Math.abs(Y(a) - Y(b)));
    s += '<rect class="bar' + (d[1] < 0 ? " neg" : "") + '" data-tip="' + d[0] + ": " + (d[1] > 0 && d[2] !== "total" ? "+" : "") + d[1] + " — " + d[3] + '" x="' + x + '" y="' + top + '" width="' + bw + '" height="' + h + '" rx="4" fill="' + col + '" style="transition-delay:' + i * .18 + 's"/>';
    s += '<text class="vl" x="' + (x + bw / 2) + '" y="' + (top - 7) + '" text-anchor="middle">' + (d[0] === "This game" ? "+" : d[2] === "total" ? "" : d[1] > 0 ? "+" : "−") + Math.abs(d[1]) + "</text>";
    s += '<text class="xl" x="' + (x + bw / 2) + '" y="' + (H + 18) + '" text-anchor="middle">' + d[0] + "</text>";
    if (i < D.length - 1 && D[i + 1][2] !== "total") s += '<line x1="' + (x + bw) + '" x2="' + (x + bw + gap) + '" y1="' + Y(run) + '" y2="' + Y(run) + '" stroke="#B8ABDA" stroke-dasharray="2 3"/>';
  });
  var g = document.getElementById("g"); g.innerHTML = s;
  var tip = document.getElementById("tip"), c = document.getElementById("c");
  g.addEventListener("mousemove", function (e) { var r = e.target.closest("rect[data-tip]"); if (!r) { tip.style.opacity = 0; return; }
    var cb = c.getBoundingClientRect(), sc = cb.width / 600; tip.textContent = r.dataset.tip; tip.style.opacity = 1;
    tip.style.left = (e.clientX - cb.left) / sc + 12 + "px"; tip.style.top = (e.clientY - cb.top) / sc - 30 + "px"; });
  g.addEventListener("mouseleave", function () { tip.style.opacity = 0; });
  whenSeen(document.getElementById("f"));
</script></body></html>
