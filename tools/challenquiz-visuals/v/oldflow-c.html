<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="One phone steps through the real old game with a running count of the friction points. Click a step to stop on it; Play resumes.">
<title>Challenquiz — old flow (C)</title>
<link rel="stylesheet" href="cq.css">
<script src="cq.js"></script>
<style>
  .canvas { height: 393px; }
  #slot { position: absolute; left: 70px; top: 24px; }
  .copy { position: absolute; left: 280px; right: 40px; top: 70px; }
  .stp { font: 600 12px/1 "Figtree"; letter-spacing: .06em; text-transform: uppercase; color: var(--pg-faint); }
  .big { font: 600 30px/1.15 "Figtree"; letter-spacing: -.01em; margin: 10px 0 8px; }
  .sm { font: 400 15px/22px "Figtree"; color: var(--pg-muted); min-height: 66px; }
  /* the step pills: click one to stop on that screen; play resumes the walk-through */
  .dots { display: flex; gap: 4px; margin-top: 18px; align-items: center; }
  .dots button { border: 0; background: none; padding: 9px 2px; cursor: pointer; border-radius: 6px; }
  .dots button i { display: block; width: 26px; height: 5px; border-radius: 3px; background: var(--pg-frame-2); transition: background .3s, transform .2s; }
  .dots button:hover i { transform: scaleY(1.6); }
  .dots button.on i { background: var(--pg-ink); } .dots button.fr.on i { background: var(--pg-neg); }
  .dots button.cur i { transform: scaleY(1.6); }
  .dots button:focus-visible { outline: 2px solid var(--cq-500); outline-offset: 1px; }
  .pp { margin-left: 8px; border: 0; background: #fff; box-shadow: 0 0 0 1px var(--pg-border); border-radius: 999px; padding: 5px 10px; font: 500 11px/1 "Figtree"; color: var(--pg-muted); cursor: pointer; }
  .cnt { margin-top: 16px; }
</style></head><body>
<div class="frame" id="f"><div class="canvas">
  <div id="slot"></div>
  <div class="copy"><div class="stp" id="stp"></div><div class="big" id="big"></div><div class="sm" id="sm"></div>
    <div class="dots" id="dots" role="group" aria-label="Steps of the old game"></div><div class="cnt"><span class="tag tag--neg" id="cnt">Friction 0 of 4</span></div></div>
</div></div>
<script>
  document.getElementById("slot").innerHTML = old(1, 160, { id: "ph" });
  var dots = document.getElementById("dots");
  dots.innerHTML = OLD.map(function (st, i) { return '<button class="' + (st.f ? "fr" : "") + '" data-i="' + i + '" aria-label="Step ' + (i + 1) + ": " + st.t + '"><i></i></button>'; }).join("") +
    '<button class="pp" id="pp" aria-label="Pause the walk-through">Pause</button>';
  var img = document.querySelector("#ph img"), cur = 0, paused = false, token = 0;
  function show(i) {
    cur = i; var st = OLD[i]; img.src = "img/old-" + (i + 1) + ".png";
    document.getElementById("stp").textContent = "Step " + (i + 1) + " of 6";
    document.getElementById("big").textContent = st.t; document.getElementById("sm").textContent = st.d.charAt(0).toUpperCase() + st.d.slice(1) + ".";
    dots.querySelectorAll("button[data-i]").forEach(function (d, k) { d.classList.toggle("on", k <= i); d.classList.toggle("cur", k === i); d.setAttribute("aria-current", k === i ? "step" : "false"); });
    document.getElementById("cnt").textContent = "Friction " + OLD.slice(0, i + 1).filter(function (x) { return x.f; }).length + " of 4";
  }
  function setPaused(p) { paused = p; var b = document.getElementById("pp"); b.textContent = p ? "▶ Play" : "Pause"; b.setAttribute("aria-label", p ? "Play the walk-through" : "Pause the walk-through"); }
  async function play() {
    var my = ++token;
    while (my === token && !paused) { await sleep(2300); if (my !== token || paused) return; show((cur + 1) % 6); if (cur === 5) await sleep(1200); }
  }
  dots.addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    if (b.id === "pp") { setPaused(!paused); if (!paused) play(); return; }
    setPaused(true); token++; show(+b.dataset.i);
  });
  addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight" || e.key === "ArrowLeft") { setPaused(true); token++; show((cur + (e.key === "ArrowRight" ? 1 : 5)) % 6); }
  });
  show(0);
  whenSeen(document.getElementById("f"), function () { if (END) { show(5); return; } play(); });
</script>
</body></html>
