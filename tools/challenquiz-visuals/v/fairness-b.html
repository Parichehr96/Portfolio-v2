<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="A balance: showing the answer straight away tips the game towards learning and away from fairness. Four guards drop onto the other side one by one until the beam is level.">
<title>Challenquiz — fairness (B)</title>
<link rel="stylesheet" href="cq.css">
<script src="cq.js"></script>
<style>
  .canvas { height: 420px; }
  svg { position: absolute; left: 0; top: 0; }
  #beam { transform-origin: 300px 150px; transition: transform .8s cubic-bezier(.3,1.4,.5,1); }
  .pan text { font: 600 13px "Figtree"; fill: var(--pg-ink); } .sub { font: 400 11px "Figtree"; fill: #475569; }
  .w { transition: transform .6s cubic-bezier(.3,1.5,.5,1), opacity .3s; }
  .cap2 { position: absolute; left: 0; right: 0; bottom: 18px; text-align: center; font: 500 13px/1 "Figtree"; color: var(--pg-muted); }
</style></head><body>
<div class="frame frame--white" id="f"><div class="canvas"><button class="replay" id="r">↻ Replay</button>
<svg width="600" height="370" viewBox="0 0 600 370">
  <path d="M300 150 L272 330 L328 330 Z" fill="#E8ECF0"/><rect x="236" y="328" width="128" height="8" rx="4" fill="#E2E8F0"/>
  <g id="beam">
    <rect x="110" y="146" width="380" height="8" rx="4" fill="#0D1233"/><circle cx="300" cy="150" r="9" fill="#0D1233"/>
    <g class="pan"><line x1="130" y1="150" x2="130" y2="270" stroke="#0D1233" stroke-width="1.5"/><rect x="66" y="270" width="128" height="34" rx="10" fill="#EFEAFB"/>
      <text x="130" y="292" text-anchor="middle">Learning</text><text class="sub" x="130" y="320" text-anchor="middle">show the answer now</text></g>
    <g class="pan"><line x1="470" y1="150" x2="470" y2="270" stroke="#0D1233" stroke-width="1.5"/><rect x="406" y="270" width="128" height="34" rx="10" fill="#F3F6F8"/>
      <text x="470" y="292" text-anchor="middle">Fairness</text><text class="sub" x="470" y="320" text-anchor="middle">no answer worth leaking</text>
      <g id="ws"></g></g>
  </g>
</svg>
<div class="cap2" id="cap">Show the answer, and a friend still playing could use it…</div></div></div>
<script>
  var W = ["Own question order", "Shuffled options", "20 s + speed counts", "Large question bank"];
  var ws = document.getElementById("ws");
  ws.innerHTML = W.map(function (t, i) { var y = 266 - i * 26; return '<g class="w" id="w' + i + '" style="opacity:0;transform:translateY(-60px)"><rect x="414" y="' + (y - 20) + '" width="112" height="22" rx="7" fill="#5425A0"/><text x="470" y="' + (y - 5) + '" text-anchor="middle" style="font:500 10.5px Figtree;fill:#fff">' + t + "</text></g>"; }).join("");
  var beam = document.getElementById("beam");
  async function run() {
    W.forEach(function (_, i) { var w = document.getElementById("w" + i); w.style.opacity = 0; w.style.transform = "translateY(-60px)"; });
    beam.style.transform = "rotate(-12deg)"; document.getElementById("cap").textContent = "Show the answer, and a friend still playing could use it…";
    await sleep(1300);
    for (var i = 0; i < 4; i++) { var w = document.getElementById("w" + i); w.style.opacity = 1; w.style.transform = "none"; beam.style.transform = "rotate(" + (-12 + (i + 1) * 3) + "deg)"; await sleep(800); }
    document.getElementById("cap").textContent = "…so the answers stay, and leaking them became pointless.";
  }
  document.getElementById("r").onclick = run; whenSeen(document.getElementById("f"), run);
</script></body></html>
