<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Three ways a room could work, compared on what mattered: how you start, how you finish, whether opponents feel real, and whether it survives a small player base and Telegram's interruptions. The third was chosen.">
<title>Challenquiz — rooms (B)</title>
<link rel="stylesheet" href="cq.css">
<script src="cq.js"></script>
<style>
  .canvas { height: 404px; padding: 18px 20px 0; }
  table { width: 100%; border-collapse: separate; border-spacing: 0; font: 400 12px/16px "Figtree"; }
  th, td { padding: 9px 10px; text-align: left; border-top: 1px solid var(--pg-border); vertical-align: top; }
  thead th { border-top: 0; font: 600 12.5px/1.25 "Figtree"; color: var(--pg-ink); padding-bottom: 12px; }
  thead th small { display: block; font: 400 11px/1.3 "Figtree"; color: var(--pg-muted); margin-top: 3px; }
  td:first-child { font-weight: 600; color: var(--pg-ink); width: 126px; }
  td { color: var(--pg-muted); }
  .y::before, .n::before, .m::before { display: inline-block; width: 16px; font-weight: 700; }
  .y::before { content: "✓"; color: var(--pg-pos); } .n::before { content: "✕"; color: var(--pg-neg); } .m::before { content: "~"; color: #B36B00; }
  /* the chosen column: one rounded shape behind it, not per-cell fills */
  .tw { position: relative; }
  .hl { position: absolute; top: 0; bottom: 0; border-radius: 14px; background: #EFEAFB; z-index: 0; }
  table { position: relative; z-index: 1; }
  th, td { border-color: rgba(226, 232, 240, .9); }
  .chip { display: inline-block; margin-top: 6px; font: 600 10px/1 "Figtree"; letter-spacing: .06em; text-transform: uppercase; color: var(--cq-700); }
  tbody tr { opacity: 0; transition: opacity .4s; } .is-in tbody tr { opacity: 1; }
</style></head><body>
<div class="frame frame--white" id="f"><div class="canvas"><div class="tw"><span class="hl" id="hl"></span><table>
  <thead><tr><th></th><th>Live room<small>everyone at once</small></th><th>Plain async<small>result when it fills</small></th><th class="pick">Feels live<small>async, opponents shown</small><span class="chip">Chosen</span></th></tr></thead>
  <tbody id="tb"></tbody></table></div></div></div>
<script>
  var R = [["Start", ["n", "the old empty lobby, back"], ["y", "instant"], ["y", "instant"]],
           ["End", ["y", "instant result"], ["n", "“Did I win?” again"], ["y", "rank at once, bonus when it settles"]],
           ["Opponents feel real", ["y", "strongest"], ["n", "no one in sight"], ["y", "the room's answers + live rank"]],
           ["A few hundred players", ["n", "rooms rarely fill together"], ["y", "fine"], ["y", "fine"]],
           ["Calls, app switches", ["n", "drop out, lose the round"], ["y", "fine"], ["y", "resume within the timer"]],
           ["Fairness", ["y", "built in"], ["m", "needs design"], ["m", "designed in (next section)"]]];
  document.getElementById("tb").innerHTML = R.map(function (r, i) {
    return '<tr style="transition-delay:' + (i * .1) + 's"><td>' + r[0] + "</td>" + r.slice(1).map(function (c, k) { return '<td class="' + c[0] + (k === 2 ? " pick" : "") + '">' + c[1] + "</td>"; }).join("") + "</tr>";
  }).join("");
  function hl() { var th = document.querySelector("thead th.pick"), h = document.getElementById("hl"); h.style.left = th.offsetLeft + "px"; h.style.width = th.offsetWidth + "px"; }
  hl(); addEventListener("load", hl);
  whenSeen(document.getElementById("f"));
</script></body></html>
