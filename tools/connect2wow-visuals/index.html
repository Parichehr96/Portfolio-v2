<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connect2WOW visuals</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --ink:#0D1233; --muted:#475569; --faint:rgba(71,85,105,.6); --line:#E2E8F0; --bg:#FFFFFF; --soft:#F9FBFB; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Figtree", system-ui, sans-serif; }
  header { padding: 40px 32px 8px; max-width: 1900px; margin: 0 auto; }
  h1 { font-size: 24px; margin: 0 0 6px; }
  header p { color: var(--muted); margin: 0; font-size: 15px; max-width: 760px; line-height: 22px; }
  nav { position: sticky; top: 0; z-index: 2; background: rgba(255,255,255,.92); backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line); padding: 10px 32px; display: flex; gap: 6px; flex-wrap: wrap; }
  nav a { font-size: 13px; color: var(--muted); text-decoration: none; padding: 4px 10px; border-radius: 999px; background: #F3F6F8; }
  nav a:hover { color: var(--ink); }
  section { padding: 36px 32px 20px; max-width: 1900px; margin: 0 auto; border-bottom: 1px solid var(--line); }
  section h2 { font-size: 18px; margin: 0 0 4px; display: flex; gap: 10px; align-items: baseline; }
  section h2 small { font-size: 12px; color: var(--faint); font-weight: 500; }
  section > p { margin: 0 0 18px; color: var(--muted); font-size: 14px; max-width: 820px; line-height: 21px; }
  .row { display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); gap: 24px; align-items: start; }
  figure { margin: 0; }
  figcaption { margin-top: 10px; font-size: 13px; line-height: 19px; color: var(--muted); }
  figcaption b { color: var(--ink); font-weight: 600; }
  figcaption a { color: var(--muted); font-size: 12px; }
  iframe { display: block; width: 100%; border: 0; height: 300px; }
  @media (max-width: 600px) { header, nav, section { padding-left: 16px; padding-right: 16px; } .row { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1>Connect2WOW — case-study visuals</h1>
  <p>Three variants for every visual in the copy draft (except §09 Team). Each is a standalone page, drawn for the
  case column (600 px) and scaled to fit — open it on its own to use it as an embed. Motion starts when the
  visual is half on screen.</p>
</header>
<nav id="toc"></nav>
<main id="sets"></main>
<script>
  var SETS = [
    ["hero", "Hero", "Cover", "One shell, every module: the frame stays, only the module changes."],
    ["metrics", "§02", "At a glance", "Four numbers that describe the system instead of usage."],
    ["problem", "§03", "Problem", "Scattered tools become one product."],
    ["audiences", "§04", "Audiences", "Office to site: who uses it and where."],
    ["persona", "§05", "Persona + empathy map", "Sarah's research, and the notes that became decisions."],
    ["compare", "§06", "How it compared", "BambooHR, Personio and HiBob against an industry product."],
    ["approach", "§07", "Approach", "Double Diamond, with what each phase produced."],
    ["ia", "§08", "Information architecture", "Seven modules on a platform layer."],
    ["foundations", "§10", "Foundations", "Colour, type and icons, and how little colour the product uses."],
    ["atoms", "§11", "Components", "From one input to a whole screen."],
    ["notif", "§12", "Notifications", "The four-axis model, shown three ways."],
    ["product", "§13", "The product", "Real modules, captioned with the parts they reuse."],
    ["hands", "Idea 1", "Three hands, one product", "Three designers' versions of a card become one."],
    ["officesite", "Idea 3", "Office vs site", "The same record at head office and in the field."],
    ["constellation", "Idea 4", "Module constellation", "Shared components light up every module that uses them."]
  ];
  var NOTES = window.NOTES = {};
  var toc = document.getElementById("toc"), sets = document.getElementById("sets");
  SETS.forEach(function (s) {
    toc.insertAdjacentHTML("beforeend", '<a href="#' + s[0] + '">' + s[1] + " " + s[2] + "</a>");
    var figs = ["a", "b", "c"].map(function (v) {
      var src = "v/" + s[0] + "-" + v + ".html";
      return '<figure><iframe loading="lazy" src="' + src + '" title="' + s[2] + " variant " + v.toUpperCase() + '"></iframe>' +
        '<figcaption id="cap-' + s[0] + "-" + v + '"><b>' + v.toUpperCase() + '</b> · <a href="' + src + '" target="_blank">open alone ↗</a></figcaption></figure>';
    }).join("");
    sets.insertAdjacentHTML("beforeend", '<section id="' + s[0] + '"><h2>' + s[2] + " <small>" + s[1] + "</small></h2><p>" + s[3] + '</p><div class="row">' + figs + "</div></section>");
  });
  /* Size each iframe to its page, and borrow the variant's own one-line
     description (its <meta name="description">) for the caption. */
  function size(f) {
    try {
      var d = f.contentDocument; if (!d || !d.body) return;
      f.style.height = Math.ceil(d.documentElement.scrollHeight) + "px";
      var m = d.querySelector('meta[name="description"]'), id = f.getAttribute("src").replace(/^v\/|\.html$/g, "");
      var cap = document.getElementById("cap-" + id);
      if (m && cap && !cap.dataset.done) { cap.dataset.done = 1; cap.querySelector("b").insertAdjacentText("afterend", " " + m.content); }
    } catch (e) {}
  }
  document.querySelectorAll("iframe").forEach(function (f) {
    f.addEventListener("load", function () { size(f); setTimeout(function () { size(f); }, 400); setTimeout(function () { size(f); }, 1500); });
  });
  window.addEventListener("resize", function () { document.querySelectorAll("iframe").forEach(size); });
</script>
</body>
</html>
