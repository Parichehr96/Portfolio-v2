<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="A switch labelled 'Design system'. Off: three different cards with their differences called out. On: three identical cards. Readers flip it themselves.">
<title>Connect2WOW — system switch (B)</title>
<link rel="stylesheet" href="c2w.css">
<script src="c2w.js"></script>
<script src="hands-shared.js"></script>
<style>
  .canvas { height: 290px; }
  .sw { position: absolute; left: 24px; top: 22px; display: flex; gap: 10px; align-items: center; cursor: pointer; font: 600 13px/1 "Figtree"; user-select: none; }
  .sw i { width: 40px; height: 22px; border-radius: 11px; background: #CBD5E1; position: relative; transition: background .3s; }
  .sw i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: left .3s var(--ease); box-shadow: 0 1px 3px rgba(0,0,0,.2); }
  .on .sw i { background: var(--c2w-p10); } .on .sw i::after { left: 21px; }
  .sw small { font: 400 11px/1 "Figtree"; color: var(--pg-muted); }
  .row { position: absolute; left: 24px; right: 24px; top: 74px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .cell { position: relative; }
  .cell > div { transition: opacity .25s; }
  .diff { margin-top: 10px; display: grid; gap: 4px; }
  .diff span { font: 500 10px/1.3 "Figtree"; color: var(--pg-neg); display: flex; gap: 5px; }
  .diff span::before { content: "≠"; font-weight: 700; }
  .on .diff span { color: var(--pg-pos); } .on .diff span::before { content: "="; }
  .fade { opacity: 0; }
</style>
</head>
<body>
<div class="frame" id="f">
  <div class="canvas" id="c">
    <label class="sw" id="sw"><i></i>Design system <small id="st">off</small></label>
    <div class="row" id="row"></div>
  </div>
</div>
<script>
  var D = [["radius 4", "green CAPS buttons", "square avatar"], ["radius 14", "pill buttons, serif", "round avatar"], ["radius 0", "black buttons, mono", "“OK / No” labels"]];
  var S = ["radius 8", "one button pair", "round avatar"];
  var row = document.getElementById("row"), c = document.getElementById("c"), on = false;
  function render() {
    row.innerHTML = [0, 1, 2].map(function (i) {
      return '<div class="cell"><div>' + HANDS.card(on ? HANDS.SYS : HANDS.V[i]) + '</div><div class="diff">' + (on ? S : D[i]).map(function (d) { return "<span>" + d + "</span>"; }).join("") + "</div></div>";
    }).join("");
  }
  async function set(v) {
    on = v; c.classList.toggle("on", on); document.getElementById("st").textContent = on ? "on" : "off";
    row.classList.add("fade"); row.style.transition = "opacity .2s"; await sleep(200); render(); row.classList.remove("fade");
  }
  render();
  var auto = true;
  document.getElementById("sw").onclick = function (e) { e.preventDefault(); auto = false; set(!on); };
  whenSeen(document.getElementById("f"), async function () { while (auto) { await sleep(2600); if (!auto) break; set(!on); } });
</script>
</body>
</html>
