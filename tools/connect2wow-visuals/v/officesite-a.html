<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Desktop at head office, phone on site: the same certificate record, two contexts. Only use this if there was a responsive or mobile version.">
<title>Connect2WOW — office and site (A)</title>
<link rel="stylesheet" href="c2w.css">
<script src="c2w.js"></script>
<script src="screens.js"></script>
<style>
  .canvas { height: 370px; }
  .half { position: absolute; top: 0; bottom: 0; width: 50%; }
  .office { left: 0; background: linear-gradient(180deg, #EEF2F8, #F3F6F8); }
  .site { right: 0; background: linear-gradient(180deg, #FFF3DD, #FBE9C9); }
  .lab { position: absolute; top: 18px; display: flex; gap: 6px; align-items: center; font: 600 11px/1 "Figtree"; }
  .lab small { font-weight: 400; color: var(--pg-muted); }
  .desk { position: absolute; left: 18px; top: 52px; width: 262px; height: 196px; overflow: hidden; }
  .desk .in { width: 524px; transform: scale(.5); transform-origin: 0 0; }
  .stand { position: absolute; left: 124px; top: 248px; width: 50px; height: 26px; background: linear-gradient(#C9D2DF, #AEB9C9); clip-path: polygon(30% 0, 70% 0, 100% 100%, 0 100%); }
  .phone { position: absolute; left: 380px; top: 46px; width: 150px; height: 296px; border-radius: 24px; background: #111; padding: 7px; box-shadow: 0 20px 40px -16px rgba(0,0,0,.4); }
  .ph { width: 100%; height: 100%; border-radius: 18px; background: #fff; overflow: hidden; font-family: Roboto; padding: 26px 10px 10px; }
  .ph .t { font: 700 12px/1.2 Roboto; margin-bottom: 8px; }
  .row { border: 1px solid var(--c2w-line); border-radius: 8px; padding: 8px; margin-bottom: 6px; font-size: 9.5px; transition: box-shadow .4s, background .4s; }
  .row small { display: block; color: var(--c2w-sub); font-size: 8.5px; margin-top: 2px; }
  .hot { box-shadow: 0 0 0 2px #FFA600; background: #FFF8E6; }
  .link { position: absolute; left: 280px; top: 140px; width: 100px; height: 2px; background: repeating-linear-gradient(90deg, #FFA600 0 6px, transparent 6px 10px); opacity: 0; transition: opacity .4s; }
  .link.on { opacity: 1; animation: flow 1s linear infinite; }
  @keyframes flow { to { background-position: 10px 0; } }
  .foot { position: absolute; left: 18px; bottom: 16px; font: 500 11px/1.4 "Figtree"; color: var(--pg-muted); width: 262px; }
</style>
</head>
<body>
<div class="frame" id="f">
  <div class="canvas">
    <div class="half office"></div><div class="half site"></div>
    <div class="lab" style="left:18px"><span data-ico="hr" data-size="13"></span>Head office <small>· Sarah, HR</small></div>
    <div class="lab" style="left:318px"><span data-ico="hse" data-size="13"></span>North Pad camp <small>· Mark, welder</small></div>
    <div class="ui desk"><div class="in"><div class="ui-shell" style="height:392px"><div class="ui-rail" id="r"></div><div class="ui-nav" id="n"></div><div class="ui-main" id="m"></div></div></div></div>
    <div class="stand"></div>
    <div class="link" id="link"></div>
    <div class="phone"><div class="ph">
      <div class="t">My certificates</div>
      <div class="row" id="fa">First Aid<small id="fas">Expires in 12 days</small></div>
      <div class="row">QA Professional<small>Valid · Jan 2023</small></div>
      <div class="row">H2S Alive<small>Valid · Mar 2023</small></div>
      <div class="ui-btn" style="width:100%;margin-top:6px;height:24px">Book renewal</div>
    </div></div>
    <div class="foot">One record. Sarah renews it in the office; Mark sees it on site the same minute.</div>
  </div>
</div>
<script>
  document.getElementById("r").innerHTML = C2W.rail("courses"); document.getElementById("n").innerHTML = C2W.nav("courses"); document.getElementById("m").innerHTML = C2W.main("courses");
  var m = document.getElementById("m"), fa = document.getElementById("fa"), fas = document.getElementById("fas"), link = document.getElementById("link");
  whenSeen(document.getElementById("f"), async function () {
    while (true) {
      await sleep(1600);
      var card = m.querySelector(".ui-card"); card.classList.add("hot"); card.querySelector(".ui-lbl").textContent = "Renewed · valid 3 years";
      link.classList.add("on"); await sleep(900);
      fa.classList.add("hot"); fas.textContent = "Renewed · valid 3 years";
      await sleep(2600);
      card.classList.remove("hot"); fa.classList.remove("hot"); link.classList.remove("on");
      card.querySelector(".ui-lbl").textContent = "Expires in 12 days"; fas.textContent = "Expires in 12 days";
    }
  });
</script>
</body>
</html>
