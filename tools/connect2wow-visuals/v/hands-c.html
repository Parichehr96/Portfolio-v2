<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Onion skin: the three versions stacked translucent, so every mismatch ghosts; then they snap into one crisp card. Large and simple, one idea.">
<title>Connect2WOW — onion skin (C)</title>
<link rel="stylesheet" href="c2w.css">
<script src="c2w.js"></script>
<script src="hands-shared.js"></script>
<style>
  .canvas { height: 300px; }
  .stage { position: absolute; left: 150px; top: 92px; width: 300px; height: 150px; }
  .ly { position: absolute; left: 0; top: 0; width: 300px; transition: transform .9s cubic-bezier(.65,0,.35,1), opacity .6s; mix-blend-mode: multiply; }
  .ly .hc { transform-origin: 0 0; }
  .l0 { opacity: .55; transform: translate(-14px, -8px) rotate(-1.5deg); }
  .l1 { opacity: .55; transform: translate(12px, 6px) rotate(1deg); }
  .l2 { opacity: .55; transform: translate(-4px, 12px); }
  .sys { opacity: 0; }
  .snap .l0, .snap .l1, .snap .l2 { transform: none; opacity: 0; }
  .snap .sys { opacity: 1; transition-delay: .5s; }
  .cap2 { position: absolute; left: 0; right: 0; bottom: 30px; text-align: center; font: 600 14px/1.3 "Figtree"; }
  .cap2 small { display: block; font: 400 11.5px/1.4 "Figtree"; color: var(--pg-muted); }
  .tag2 { position: absolute; left: 24px; top: 22px; }
</style>
</head>
<body>
<div class="frame frame--white" id="f">
  <div class="canvas" id="c">
    <span class="tag tag--grey tag2" id="tg">3 layers · 3 hands</span>
    <div class="stage"><div class="ly l0" id="a"></div><div class="ly l1" id="b"></div><div class="ly l2" id="d"></div><div class="ly sys" id="s"></div></div>
    <div class="cap2" id="cp">Every mismatch ghosts<small>three designers, the same card, no shared rules</small></div>
  </div>
</div>
<script>
  ["a", "b", "d"].forEach(function (id, i) { document.getElementById(id).innerHTML = HANDS.card(HANDS.V[i]); });
  document.getElementById("s").innerHTML = HANDS.card(HANDS.SYS);
  var c = document.getElementById("c");
  function set(s) {
    c.classList.toggle("snap", s);
    document.getElementById("tg").textContent = s ? "1 layer · the system" : "3 layers · 3 hands";
    document.getElementById("cp").innerHTML = s ? "One crisp card<small>the system decided, so the three of us drew the same thing</small>" : "Every mismatch ghosts<small>three designers, the same card, no shared rules</small>";
  }
  whenSeen(document.getElementById("f"), async function () { var s = false; while (true) { await sleep(s ? 3000 : 2400); s = !s; set(s); } });
</script>
</body>
</html>
