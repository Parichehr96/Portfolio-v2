<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="The scattered stack: loose tools (sheets, email, paper forms, chat) drift, then fly into one ERP rail and become its modules. Replays on click.">
<title>Connect2WOW — scattered stack (A)</title>
<link rel="stylesheet" href="c2w.css">
<script src="c2w.js"></script>
<style>
  .canvas { height: 380px; }
  .tool { position: absolute; width: 132px; padding: 10px 12px; display: flex; gap: 9px; align-items: center;
    background: #fff; border-radius: 12px; box-shadow: 0 0 0 1px var(--pg-border), 0 8px 20px -10px rgba(13,18,51,.25);
    transition: left .9s var(--ease), top .9s var(--ease), width .9s var(--ease), transform .9s var(--ease), padding .9s var(--ease), border-radius .9s var(--ease), box-shadow .6s;
    animation: drift 5s ease-in-out infinite alternate; }
  .tool .i { width: 24px; height: 24px; border-radius: 7px; display: grid; place-items: center; flex: none; transition: background .6s, color .6s; }
  .tool .t { font: 500 11px/14px "Figtree"; white-space: nowrap; transition: opacity .3s; }
  .tool .t small { display: block; font-weight: 400; color: var(--pg-faint); font-size: 10px; }
  @keyframes drift { to { translate: 0 -6px; } }
  /* landed: becomes a rail icon */
  .tool.land { width: 34px; padding: 5px; border-radius: 9px; box-shadow: none; background: transparent; animation: none; transform: none !important; }
  .tool.land .t { opacity: 0; }
  .tool.land .i { background: var(--c2w-p30) !important; color: var(--c2w-p10) !important; }
  .shell { position: absolute; left: 160px; top: 40px; width: 280px; height: 300px; opacity: 0; transform: scale(.96);
    transition: opacity .6s .5s, transform .8s .5s var(--ease); }
  .done .shell { opacity: 1; transform: none; }
  .shell .ui-shell { grid-template-columns: 50px 1fr; }
  .shell .ui-main { display: grid; gap: 7px; align-content: start; padding: 14px; }
  .sk { height: 9px; border-radius: 4px; background: #EEF1F5; }
  .msg { position: absolute; left: 0; right: 0; bottom: 14px; text-align: center; font: 500 12px/1 "Figtree"; color: var(--pg-muted); transition: opacity .4s; }
  .replay { position: absolute; right: 14px; top: 12px; font: 500 11px/1 "Figtree"; color: var(--pg-muted); background: #fff; border: 0; border-radius: 999px; padding: 6px 10px; box-shadow: 0 0 0 1px var(--pg-border); cursor: pointer; }
</style>
</head>
<body>
<div class="frame" id="f">
  <div class="canvas" id="c">
    <div class="ui shell"><div class="ui-shell"><div class="ui-rail" style="gap:6px;padding-top:12px"><span class="ui-logo"></span></div>
      <div class="ui-main"><div class="sk" style="width:40%"></div><div class="ui-card" style="height:56px"></div><div class="sk"></div><div class="sk" style="width:85%"></div><div class="sk" style="width:70%"></div><div class="ui-card" style="height:70px"></div></div></div></div>
    <button class="replay" id="replay">↻ Replay</button>
    <div class="msg" id="msg">Before: six tools, none of them talking to each other</div>
  </div>
</div>
<script>
  var T = [
    ["sheet", "Payroll.xlsx", "HR in spreadsheets", "#E7F6EC", "#1F8A4C", 26, 40, -6],
    ["form", "Incident form", "safety on paper", "#FDECEC", "#D53434", 430, 34, 5],
    ["mail", "Email threads", "approvals by reply", "#EAF1FF", "#3374F5", 30, 160, 4],
    ["cal", "Shift calendar", "a separate app", "#FFF4DE", "#B36B00", 440, 150, -4],
    ["chat", "Group chat", "field ↔ office", "#F1ECFF", "#6E56CF", 40, 280, -3],
    ["doc", "Shared drive", "certificates, PDFs", "#EEF1F5", "#475569", 420, 270, 6]
  ];
  var c = document.getElementById("c"), msg = document.getElementById("msg"), els = [];
  T.forEach(function (t, i) {
    var d = document.createElement("div");
    d.className = "tool"; d.style.animationDelay = (-i * .8) + "s";
    d.innerHTML = '<span class="i" style="background:' + t[3] + ";color:" + t[4] + '">' + ico(t[0], 14) + '</span><span class="t">' + t[1] + "<small>" + t[2] + "</small></span>";
    c.appendChild(d); els.push(d);
  });
  function scatter() {
    c.classList.remove("done"); msg.textContent = "Before: six tools, none of them talking to each other";
    els.forEach(function (d, i) { var t = T[i]; d.classList.remove("land"); d.style.left = t[5] + "px"; d.style.top = t[6] + "px"; d.style.transform = "rotate(" + t[7] + "deg)"; });
  }
  async function land() {
    await sleep(1200);
    els.forEach(function (d, i) { setTimeout(function () { d.classList.add("land"); d.style.left = "168px"; d.style.top = (78 + i * 40) + "px"; }, reduced ? 0 : i * 110); });
    c.classList.add("done");
    await sleep(900); msg.textContent = "After: one product, one place for every job";
  }
  scatter();
  whenSeen(document.getElementById("f"), land);
  document.getElementById("replay").onclick = async function () { scatter(); await sleep(700); land(); };
</script>
</body>
</html>
