<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Two roles, one person: Sarah's HR view of Mark and Mark's own Profile, side by side, desktop only. Shared fields pulse in both at once.">
<title>Connect2WOW — two views of one record (B)</title>
<link rel="stylesheet" href="c2w.css">
<script src="c2w.js"></script>
<script src="screens.js"></script>
<style>
  .canvas { height: 330px; }
  .col { position: absolute; top: 16px; width: 276px; }
  .col .who { display: flex; gap: 7px; align-items: center; font: 600 11.5px/1 "Figtree"; margin-bottom: 10px; }
  .col .who .av { width: 22px; height: 22px; font-size: 9px; }
  .col .who small { font-weight: 400; color: var(--pg-muted); }
  .scr { height: 250px; overflow: hidden; position: relative; }
  .scr .in { width: 368px; transform: scale(.75); transform-origin: 0 0; }
  .eq { position: absolute; left: 292px; top: 140px; width: 16px; text-align: center; font: 700 18px/1 "Figtree"; color: var(--pg-faint); }
  .pulse { animation: p 2.4s ease-in-out infinite; border-radius: 4px; }
  @keyframes p { 0%, 100% { box-shadow: 0 0 0 0 rgba(255,166,0,0); } 40% { box-shadow: 0 0 0 3px rgba(255,166,0,.6); } }
</style>
</head>
<body>
<div class="frame" id="f">
  <div class="canvas">
    <div class="col" style="left:16px"><div class="who"><span class="av" style="background:#E2558E">SL</span>Sarah <small>· HR › Worker profile</small></div><div class="ui scr"><div class="in ui-main" id="a"></div></div></div>
    <div class="eq">=</div>
    <div class="col" style="left:308px"><div class="who"><span class="av" style="background:#3374F5">MR</span>Mark <small>· Profile › Certificates</small></div><div class="ui scr"><div class="in ui-main" id="b"></div></div></div>
  </div>
</div>
<script>
  var a = document.getElementById("a"), b = document.getElementById("b");
  a.innerHTML = C2W.main("hr"); b.innerHTML = C2W.main("profile");
  /* mark the shared data in both views */
  function mark(root, texts) { root.querySelectorAll("div, td, span").forEach(function (e) { if (e.children.length === 0 && texts.indexOf(e.textContent.trim()) > -1) e.classList.add("pulse"); }); }
  whenSeen(document.getElementById("f"), function () {
    mark(a, ["Mark Rushmore", "Welding · Journeyman"]);
    mark(b, ["Mark Rushmore", "Welding | Journeyman welder · Calgary, Canada"]);
  });
</script>
</body>
</html>
