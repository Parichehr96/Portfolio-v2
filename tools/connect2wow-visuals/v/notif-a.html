<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Reuse what exists: the three V3 notification embeds behind one tab bar (severity, attention, routing), so the deep-dive costs one block.">
<title>Connect2WOW — notifications, tabbed (A)</title>
<link rel="stylesheet" href="c2w.css">
<script src="c2w.js"></script>
<style>
  .canvas { padding: 14px; }
  .tabs { display: flex; gap: 4px; margin-bottom: 10px; }
  .tabs button { flex: 1; border: 0; border-radius: 10px; padding: 9px 10px; text-align: left; background: transparent; cursor: pointer; font: 600 12px/1.2 "Figtree"; color: var(--pg-muted); }
  .tabs button small { display: block; font: 400 10.5px/1.3 "Figtree"; color: var(--pg-faint); margin-top: 2px; }
  .tabs button.is-on { background: #fff; color: var(--pg-ink); box-shadow: 0 0 0 1px var(--pg-border); }
  .stage { background: #fff; border-radius: 12px; overflow: hidden; height: 470px; box-shadow: 0 0 0 1px var(--pg-border); }
  iframe { width: 647px; height: 620px; border: 0; transform-origin: 0 0; display: block; }
</style>
</head>
<body>
<div class="frame" id="f">
  <div class="canvas">
    <div class="tabs" id="tabs">
      <button class="is-on" data-s="existing/severity-matrix.html" data-h="438">Severity<small>one vocabulary, every component</small></button>
      <button data-s="existing/attention-pyramid.html" data-h="456">Attention<small>interrupt only when it's worth it</small></button>
      <button data-s="existing/alert-routing.html" data-h="606">Routing<small>the four axes choose the home</small></button>
    </div>
    <div class="stage" id="stage"><iframe id="ifr" src="existing/severity-matrix.html" title="Notification embed"></iframe></div>
  </div>
</div>
<script>
  var ifr = document.getElementById("ifr"), stage = document.getElementById("stage");
  /* The embeds are drawn at 647 wide; scale each to the 572 stage and size the stage to it. */
  function fit(h) { var s = 572 / 647; ifr.style.transform = "scale(" + s + ")"; stage.style.height = Math.round(h * s) + "px"; setTimeout(function () { window.dispatchEvent(new Event("resize")); }, 50); }
  fit(438);
  document.getElementById("tabs").addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    this.querySelectorAll("button").forEach(function (x) { x.classList.toggle("is-on", x === b); });
    ifr.src = b.dataset.s; ifr.style.height = b.dataset.h + "px"; fit(+b.dataset.h);
  });
</script>
</body>
</html>
