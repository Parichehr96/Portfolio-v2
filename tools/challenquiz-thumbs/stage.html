<!DOCTYPE html>
<!-- Challenquiz homepage thumbnails. One real prototype moment on the work
     card's mist panel (812 × 520, rendered at 2x = 1624 × 1040 like ONTON's).
     ?state=<prototype state>&y=<phone top offset>. Render with render.sh. -->
<html><head><meta charset="utf-8">
<style>
  html, body { margin: 0; width: 812px; height: 520px; overflow: hidden; background: #F3F6F8; }
  .phone { position: absolute; left: 50%; width: 300px; transform: translateX(-50%); border-radius: 46px; background: #0b0b10; padding: 9px;
    box-shadow: 0 30px 60px -28px rgba(21, 7, 43, .45); }
  .scr { position: relative; width: 300px; height: 650px; overflow: hidden; border-radius: 38px; background: #fff; }
  iframe { position: absolute; left: 0; top: 0; width: 393px; height: 852px; border: 0; transform: scale(.7634); transform-origin: 0 0; }
</style></head><body>
<div class="phone" id="p"><div class="scr"><iframe id="f"></iframe></div></div>
<script>
  var q = new URLSearchParams(location.search);
  document.getElementById("p").style.top = (q.get("y") || 56) + "px";
  document.getElementById("f").src = "http://localhost:8091/?state=" + (q.get("state") || "home") + "&bare";
</script>
</body></html>
