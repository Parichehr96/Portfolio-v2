<!doctype html>
<!--
  CHALLENQUIZ THUMBNAILS — recorded by record.mjs. One of the case study's
  own visuals (Assets/embeds/challenquiz/v4/<f>.html), unchanged, centred on
  the thumbnail's grey panel and scaled to fit.

  It runs on a stepped clock: a small script injected before the embed's own
  replaces its timers, animation frames and time (setTimeout, setInterval,
  requestAnimationFrame, performance.now, Date.now) with ones that move only
  when the stage says, and pins every CSS transition and animation to that
  clock. window.setT(seconds) moves it forward, so the recorder captures the
  embed's own animation evenly, frame by frame.
  ?f=<name>&h=<canvas height>
-->
<html><head><meta charset="utf-8"><style>
html, body { margin: 0; width: 812px; height: 520px; overflow: hidden; background: #F3F6F8; }
#panel { position: absolute; left: 0; top: 0; width: 487.2px; height: 312px; transform-origin: 0 0; transform: scale(1.66667); }
/* The visual on a white box of its own size, 8px corners (the thumbnails' card radius). */
.box { position: absolute; overflow: hidden; border-radius: 8px; background: #fff; }
iframe { position: absolute; left: 0; top: 0; border: 0; transform-origin: 0 0; background: transparent; }
</style></head><body><div id="panel"></div>
<script>
const q = new URLSearchParams(location.search), F = q.get("f"), H = +q.get("h") || 420, WD = +q.get("w") || 600, PAD = 40;
const SRC = q.get("src") || "/Assets/embeds/challenquiz/v4/" + F + ".html", BASE = SRC.replace(/[^/]*$/, "");
// The clock, for the visual and for any frame inside it (window.__CLOCK_JS).
const CLOCK_JS = `(function () {
  var realST = window.setTimeout.bind(window), q = [], seq = 0, rafs = [], seen = new WeakMap(), D0 = Date.now();
  // A frame inside starts at its parent's moment and is stepped with it.
  var vt = window.parent !== window && window.parent.__vtNow ? window.parent.__vtNow() : 0;
  window.__vtNow = function () { return vt; };
  // Loaded by srcdoc, a frame has no address: hand its query to URLSearchParams.
  if (window.__cqSearch) { var USP = window.URLSearchParams;
    window.URLSearchParams = function (init) { return new USP(init === "" || init == null || init === location.search ? window.__cqSearch : init); };
    window.URLSearchParams.prototype = USP.prototype; }
  // Frames inside (the phones' live prototype) get this clock too: loaded here, by srcdoc.
  window.__pending = 0;
  function clockFrame(el) {
    if (el.__clocked || !el.getAttribute("src") || !window.top.__CLOCK_JS) return;
    el.__clocked = true;
    var u = new URL(el.getAttribute("src"), document.baseURI); el.removeAttribute("src"); window.__pending++;
    fetch(u.href).then(function (r) { return r.text(); }).then(function (html) {
      el.addEventListener("load", function () { window.__pending--; }, { once: true });
      el.srcdoc = html.replace(/<head>/i, '<head><base href="' + u.href.replace(/[^/]*$/, "") + '"><script>window.__cqSearch=' +
        JSON.stringify(u.search) + ";" + window.top.__CLOCK_JS + "<\\/script>");
    });
  }
  new MutationObserver(function (ms) { ms.forEach(function (m) { [].forEach.call(m.addedNodes, function (n) {
    if (n.tagName === "IFRAME") clockFrame(n); else if (n.querySelectorAll) [].forEach.call(n.querySelectorAll("iframe"), clockFrame); }); }); })
    .observe(document.documentElement, { childList: true, subtree: true });
  window.setTimeout = function (f, ms) { var a = [].slice.call(arguments, 2), id = ++seq;
    q.push({ id: id, t: vt + (+ms || 0), f: function () { f.apply(null, a); } }); return id; };
  window.clearTimeout = window.clearInterval = function (id) { q = q.filter(function (x) { return x.id !== id; }); };
  window.setInterval = function (f, ms) { var id = ++seq, e = { id: id, t: vt + Math.max(1, +ms || 0) };
    e.f = function () { f(); e.t += Math.max(1, +ms || 0); q.push(e); }; q.push(e); return id; };
  window.requestAnimationFrame = function (cb) { var id = ++seq; rafs.push({ id: id, cb: cb }); return id; };
  window.cancelAnimationFrame = function (id) { rafs = rafs.filter(function (x) { return x.id !== id; }); };
  performance.now = function () { return vt; };
  Date.now = function () { return D0 + vt; };
  function tick() { return new Promise(function (r) { realST(r, 0); }); }
  // For finding a loop's length: the clock when a ".stage" is first swapped in again.
  new MutationObserver(function (ms) { ms.forEach(function (m) { [].forEach.call(m.addedNodes, function (n) {
    if (n.classList && n.classList.contains("stage") && window.__cycle == null && vt > 0) window.__cycle = vt; }); }); })
    .observe(document.documentElement, { childList: true, subtree: true });
  // SVG's own animations (SMIL): really always paused; their time is set from
  // the clock while the page has them running.
  var P = SVGSVGElement.prototype, rPause = P.pauseAnimations, rSet = P.setCurrentTime, svgs = [];
  function st(svg) { if (!svg.__vt) { svg.__vt = { run: true, base: vt, at: 0 }; svgs.push(svg); rPause.call(svg); } return svg.__vt; }
  P.pauseAnimations = function () { var x = st(this); if (x.run) { x.at += (vt - x.base) / 1000; x.run = false; } };
  P.unpauseAnimations = function () { var x = st(this); if (!x.run) { x.base = vt; x.run = true; } };
  P.setCurrentTime = function (t) { var x = st(this); x.at = t; x.base = vt; };
  P.getCurrentTime = function () { var x = st(this); return x.run ? x.at + (vt - x.base) / 1000 : x.at; };
  window.__advanceTo = async function (end) {
    await tick();
    for (;;) { q.sort(function (a, b) { return a.t - b.t; }); var nx = q[0];
      if (!nx || nx.t > end) break; q.shift(); vt = nx.t; nx.f(); await tick(); }
    vt = end; var rs = rafs; rafs = []; rs.forEach(function (r) { r.cb(vt); }); await tick();
    for (var w = 0; w < 200 && window.__pending > 0; w++) await new Promise(function (r) { realST(r, 25); });
    var kids = document.querySelectorAll("iframe");
    for (var c = 0; c < kids.length; c++) { try { if (kids[c].contentWindow.__advanceTo) await kids[c].contentWindow.__advanceTo(end); } catch (e) {} }
    // The phones show the live prototype in frames of their own: let them finish loading.
    for (var i = 0; i < 200; i++) {
      var busy = [].some.call(document.querySelectorAll("iframe"), function (f) {
        try { return !f.contentDocument || f.contentDocument.readyState !== "complete"; } catch (e) { return false; } });
      if (!busy) break; await new Promise(function (r) { realST(r, 25); });
    }
    document.querySelectorAll("svg").forEach(function (svg) { if (svg.ownerSVGElement) return; var x = st(svg);
      rSet.call(svg, x.run ? x.at + (vt - x.base) / 1000 : x.at); });
    document.getAnimations().forEach(function (a) {
      if (!seen.has(a)) seen.set(a, vt - (a.currentTime || 0));
      a.pause(); a.currentTime = Math.max(0, vt - seen.get(a)); });
  };
})();`;
window.__CLOCK_JS = CLOCK_JS;
// The thumbnails' visuals: white grounds (the box gives the corners), no Replay.
const CLOCK = `<style>.replay{display:none!important}.frame{background:#fff!important;border-radius:0!important;box-shadow:none!important}</style>` +
  `<script>window.CQ_APP = "/Assets/embeds/challenquiz/v2/index.html";` + CLOCK_JS + `<\/script>`;
let win;
window.setT = async function (t) {
  await win.__advanceTo(t * 1000);
  await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
};
fetch(SRC).then(r => r.text()).then(html => {
  html = html.replace(/<head>/i, '<head><base href="' + BASE + '">' + CLOCK);
  const s = Math.min((487.2 - PAD) / WD, (312 - PAD) / H), ifr = document.createElement("iframe"), box = document.createElement("div");
  box.className = "box";
  Object.assign(box.style, { width: WD * s + "px", height: H * s + "px", left: (487.2 - WD * s) / 2 + "px", top: (312 - H * s) / 2 + "px" });
  Object.assign(ifr.style, { width: WD + "px", height: H + "px", transform: `scale(${s})` });
  ifr.srcdoc = html;
  ifr.onload = async () => { win = ifr.contentWindow; await win.document.fonts.ready; await window.setT(0); document.title = "ready"; };
  box.appendChild(ifr); document.getElementById("panel").appendChild(box);
});
</script></body></html>
