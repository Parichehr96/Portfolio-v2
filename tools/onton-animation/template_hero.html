<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ONTON — discover events</title>
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:transparent;}
  /* Same frame as the event-creation animation: 620 x 406.1, 20 radius,
     everything clipped by it. */
  .frame{position:relative;width:100%;max-width:620px;aspect-ratio:620/406.1;margin:0 auto;
    background:#fff;border-radius:3.2258%/4.9249%;overflow:hidden;}
  .stage{display:block;width:100%;height:100%;}

  #rise{transform:translateY(420px);}

  /* 2: the Nearby tag, plain → selected (Figma's own two states) */
  #tag-bg,#tag-label,#tag-caret{transition:fill .2s ease,fill-opacity .2s ease;}
  .tag-on #tag-bg{fill:#007AFF;fill-opacity:1;}
  .tag-on #tag-label,.tag-on #tag-caret{fill:#fff;}

  /* 2: the dropdown unfolds from under the tag */
  #menu{opacity:0;transform:translateY(-6px) scale(.96);transform-box:fill-box;transform-origin:0 0;
    transition:opacity .22s ease,transform .32s cubic-bezier(.2,.9,.25,1);}
  #menu.is-open{opacity:1;transform:none;}
  #menu.is-closing{opacity:0;transform:translateY(-4px) scale(.98);
    transition:opacity .2s ease,transform .2s ease-in;}
  [id^="opt"]{transition:fill .18s ease;}

  /* 3 → 4: frame 4's content waits off to the left, its tab items unseen */
  #d-content{transform:translateX(-172px);}
  #d-nav{opacity:0;}
  #d-ev{transform-box:fill-box;transform-origin:50% 50%;}

  /* 4 → 5: the Ticket button presses in, then becomes the ticket */
  #d-ticket{transform-box:fill-box;transform-origin:50% 50%;transition:transform .14s ease;}
  #d-ticket.is-pressed{transform:scale(.93);}
  #d-ticket rect{transition:fill .14s ease;}
  #d-ticket.is-pressed rect{fill:#0062D6;}
  #e-ticket,#e-dl{opacity:0;}
  /* 6: the scan line; 7: the checked-in QR, both waiting in the ticket */
  #scan,#qr7{opacity:0;}
  #chk-badge{transform-box:fill-box;transform-origin:50% 50%;}
</style>
</head>
<body>
  <div class="frame">
  <svg class="stage" viewBox="0 0 620 406.1" fill="none" role="img"
       aria-label="The ONTON app: the Discover screen's Nearby filter runs through its distance options, the Event tab opens, a ticket is opened, scanned and checked in">
    <defs>
      %%DEFS%%
      <!-- frame 5's background blur (Figma doesn't export it) -->
      <filter id="veil-blur" x="-5%" y="-5%" width="110%" height="110%"><feGaussianBlur stdDeviation="2.6"/></filter>
      <!-- the growing ticket's shadow, so its shape reads on the white veil -->
      <filter id="card-shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.16"/></filter>
      <!-- the scanner's glow -->
      <filter id="scan-glow" x="-10%" y="-600%" width="120%" height="1300%"><feGaussianBlur stdDeviation="2.2"/></filter>
    </defs>
    <g id="rise"><g id="cam">
      <!-- frame 1: the whole phone, small -->
      <g id="layA">
        %%LAYER_A%%
      </g>
      <!-- frame 2: the phone, large -->
      <g id="layB" opacity="0">
        %%LAYER_B%%
      </g>
      <!-- frame 3 (small again), carrying frame 4's content for 3 → 4 -->
      <g id="layC" opacity="0">
        %%LAYER_C%%
      </g>
      <!-- frame 5 (ticket), carrying frame 6's scan line and frame 7's QR -->
      <g id="layE" opacity="0">
        %%LAYER_E%%
      </g>
      <!-- 4 → 5: the Ticket button, growing into the ticket -->
      <rect id="tmorph" x="0" y="0" width="0" height="0" rx="8" fill="#007AFF" opacity="0" filter="url(#card-shadow)"/>
    </g></g>
  </svg>
  </div>

<script>
(() => {
  const PARTS = %%PARTS%%;
  const $ = (s) => document.querySelector(s);
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  const lerp = (a, b, p) => a + (b - a) * p;
  const clamp = (v) => Math.min(1, Math.max(0, v));
  // Curves. Long, decelerating ease-outs for anything arriving; a symmetric
  // ease for the camera; a lightly damped spring for the tab bar's bounce.
  const easeOutQuint = (t) => 1 - Math.pow(1 - t, 5);
  const easeOutCubic = (t) => 1 - Math.pow(1 - t, 3);
  const easeInOutCubic = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
  const easeInOutSine = (t) => -(Math.cos(Math.PI * t) - 1) / 2;
  const easeOutBack = (t, s = 0.9) => 1 + (s + 1) * Math.pow(t - 1, 3) + s * Math.pow(t - 1, 2);
  const spring = (t) => 1 - Math.exp(-6.5 * t) * Math.cos(11 * t);
  function tween(ms, step, ease = (t) => t) {
    return new Promise((done) => {
      let t0 = null;
      const tick = (now) => {
        if (t0 === null) t0 = now;
        const p = Math.min(1, (now - t0) / ms);
        step(ease(p));
        if (p < 1) requestAnimationFrame(tick); else done();
      };
      requestAnimationFrame(tick);
    });
  }

  // The stage as authored: every loop swaps a fresh copy back in.
  const pristine = $(".stage").cloneNode(true);

  if (matchMedia("(prefers-reduced-motion: reduce)").matches) {
    const layA = $("#layA"), layE = $("#layE");
    rise.style.transform = "none";
    // reduced motion: the last frame, checked in
    layA.setAttribute("opacity", 0);
    $("#layE").setAttribute("opacity", 1);
    ["#e-bg1", "#e-bg2"].forEach((s) => $(s).setAttribute("filter", "url(#veil-blur)"));
    ["#e-ticket", "#e-dl", "#qr7"].forEach((s) => ($(s).style.opacity = 1));
    $("#e-qr").style.opacity = 0;
    return;
  }

  // One cycle, 1 → 7, on whatever stage is in the page.
  async function cycle() {
  const layA = $("#layA"), layB = $("#layB"), layC = $("#layC"), layE = $("#layE");
  const rise = $("#rise"), cam = $("#cam");

  /* ---- the zooms -----------------------------------------------------------
     An axis-aligned similarity is [sx, sy, tx, ty]: p → (sx·x + tx, sy·y + ty).
     G maps one frame's phone onto the other's; for each named part, M maps
     its box in the first onto its box in the second. The first layer runs
     I → G with each part's total I → M; the second runs G⁻¹ → I with each
     part's total M⁻¹ → I. Interpolating those four numbers linearly keeps
     every part exactly on its twin throughout, so the cross-fade never shows
     two of anything. Frames 1 → 2 zoom in; 2 → 3 zoom back out. */
  const I = [1, 1, 0, 0];
  const mul = (a, b) => [a[0] * b[0], a[1] * b[1], a[0] * b[2] + a[2], a[1] * b[3] + a[3]];
  const inv = (a) => [1 / a[0], 1 / a[1], -a[2] / a[0], -a[3] / a[1]];
  const mix = (a, b, p) => a.map((v, i) => lerp(v, b[i], p));
  const css = (m) => `matrix(${m[0]} 0 0 ${m[1]} ${m[2]} ${m[3]})`;
  function box(el, lay) {
    const b = el.getBBox();
    const m = lay.getCTM().inverse().multiply(el.getCTM());
    return { x: m.a * b.x + m.e, y: m.d * b.y + m.f, w: m.a * b.width, h: m.d * b.height };
  }
  const onto = (a, b, stretch) => {
    const sx = b.w / a.w, sy = stretch ? b.h / a.h : sx;
    return [sx, sy, b.x + b.w / 2 - sx * (a.x + a.w / 2), b.y + b.h / 2 - sy * (a.y + a.h / 2)];
  };
  const partsOf = (k) => [...Array(PARTS.n).keys()].map((i) => $(`#${k}-p${i}`));
  // measured once, while nothing is transformed
  function pair(X, Y, kx, ky) {
    const px = partsOf(kx), py = partsOf(ky);
    const G = onto(box(px[0], X), box(py[0], Y), false);    // part 0 is the bezel
    G[1] = G[0];                                              // the camera zooms evenly
    const M = px.map((a, i) => onto(box(a, X), box(py[i], Y), PARTS.stretch.includes(i)));
    return { X, Y, px, py, G, M };
  }
  const zoomIn = pair(layA, layB, "a", "b");
  const zoomOut = pair(layB, layC, "b", "c");

  function morph(z, e, fadeFrom = 0.2, fadeTo = 0.75) {
    const LX = mix(I, z.G, e), LY = mix(inv(z.G), I, e);
    z.X.setAttribute("transform", css(LX));
    z.Y.setAttribute("transform", css(LY));
    z.M.forEach((m, i) => {
      z.px[i].setAttribute("transform", css(mul(inv(LX), mix(I, m, e))));
      z.py[i].setAttribute("transform", css(mul(inv(LY), mix(inv(m), I, e))));
    });
    const f = clamp((e - fadeFrom) / (fadeTo - fadeFrom));
    z.X.setAttribute("opacity", 1 - f);
    z.Y.setAttribute("opacity", f);
  }

  /* ---- 2: the dropdown ---------------------------------------------------- */
  const opts = [...Array(6).keys()].map((i) => $("#opt" + i));
  const top0 = opts[0].getBBox().y;
  const ROWS = opts.map((o, i) => (i === 0 ? 0 : o.getBBox().y - top0));   // Figma's own rows
  const hl = $("#hl");
  let hlAt = 0;
  function light(i) { opts.forEach((o, k) => o.setAttribute("fill", k === i ? "black" : "#475569")); }
  // the highlight glides to row i; the row it reaches takes the ink
  async function glide(i, ms, ease) {
    const from = hlAt; hlAt = ROWS[i];
    light(i);
    await tween(ms, (p) => hl.setAttribute("transform", `translate(0 ${lerp(from, hlAt, p)})`), ease);
  }

  async function play() {
    // 1 — the phone rises into frame 1; the zoom starts as it settles
    const rising = tween(850, (p) => (rise.style.transform = `translateY(${lerp(420, 0, p)}px)`), easeOutQuint);
    await rising;
    await wait(800);                 // frame 1 holds

    // 1 → 2 — zoom into frame 2; the tag lights as the camera lands
    const zooming = tween(900, (e) => morph(zoomIn, e), easeInOutCubic);
    await wait(760);
    $("#b-p6").classList.add("tag-on");
    await zooming; await rising;

    // 2 — the menu unfolds; the highlight walks down, a beat on each option,
    // then sweeps back up to Nearby in one go
    await wait(60);
    $("#menu").classList.add("is-open");
    await wait(260);
    for (let i = 1; i <= 5; i++) {
      await glide(i, 200, easeOutCubic);
      await wait(90);
    }
    await wait(80);
    await glide(0, 340, easeInOutCubic);
    await wait(120);
    // the menu folds away and the tag turns off
    $("#menu").classList.add("is-closing");
    $("#b-p6").classList.remove("tag-on");
    await wait(320);

    // 2 → 3 — back out to the whole phone
    await tween(950, (e) => morph(zoomOut, e, 0.25, 0.8), easeInOutCubic);
    await wait(450);

    // 3 → 4 — the Event tab: the selection springs across the tab bar while
    // the list slides out to the right and the Event screen follows it in
    // from the left; the header settles the 1px frame 4 sits higher
    const list = $("#c-list"), next = $("#d-content");
    const chrome = [$("#c-p3"), $("#c-p4"), $("#c-p5")];
    const cTabs = [$("#c-ev"), $("#c-disc"), $("#c-chan")], dNav = $("#d-nav"), dEv = $("#d-ev");
    tween(260, (p) => { cTabs.forEach((t) => (t.style.opacity = 1 - p)); dNav.style.opacity = p; }, easeInOutSine);
    tween(700, (p) => (dEv.style.transform = `scale(${lerp(0.82, 1, spring(p))})`));
    const out = tween(620, (p) => (list.style.transform = `translateX(${172 * p}px)`), easeInOutCubic);
    await wait(90);
    await tween(760, (p) => {
      next.style.transform = `translateX(${-172 * (1 - p)}px)`;
      chrome.forEach((c) => c.setAttribute("transform", `translate(0 ${-p})`));
    }, (t) => easeOutBack(t, 0.6));
    await out;
    await wait(700);                 // frame 4 holds: the Event screen

    // 4 → 5 — the camera moves in on the live event; Ticket is tapped
    const btn = $("#d-ticket"), btnRect = btn.querySelector("rect");
    const live = box($("#d-ticket").parentNode.parentNode, layC);     // the live event card
    const K = 2.1, V = [310, 203];                                    // zoom, and where it lands
    const P = [live.x + live.w / 2, live.y + live.h / 2];
    const CAM = [K, K, V[0] - K * P[0], V[1] - K * P[1]];
    await tween(750, (p) => cam.setAttribute("transform", css(mix(I, CAM, p))), easeInOutCubic);
    await wait(220);
    btn.classList.add("is-pressed");
    await wait(170);
    btn.classList.remove("is-pressed");
    await wait(90);

    // from the zoomed view, the button grows into the ticket as the camera
    // pulls back; the screen behind blurs; then the ticket's face appears
    const b0 = box(btnRect, layC), b1 = box($("#e-card"), layE);
    ["#e-bg1", "#e-bg2"].forEach((s) => $(s).setAttribute("filter", "url(#veil-blur)"));
    const tm = $("#tmorph");
    tm.setAttribute("opacity", 1);
    btn.style.opacity = 0;
    const blue = [0, 122, 255];
    await tween(475, (p) => {
      cam.setAttribute("transform", css(mix(CAM, I, p)));
      tm.setAttribute("x", lerp(b0.x, b1.x, p)); tm.setAttribute("y", lerp(b0.y, b1.y, p));
      tm.setAttribute("width", lerp(b0.w, b1.w, p)); tm.setAttribute("height", lerp(b0.h, b1.h, p));
      tm.setAttribute("rx", lerp(8, 10, p));
      const w = clamp((p - 0.3) / 0.55);          // stays blue until it's clearly growing
      tm.setAttribute("fill", `rgb(${blue.map((v) => Math.round(lerp(v, 255, w))).join(",")})`);
      layE.setAttribute("opacity", clamp((p - 0.35) / 0.45));
    }, easeInOutCubic);
    layC.setAttribute("opacity", 0);
    const tick = $("#e-ticket"), dl = $("#e-dl");
    tween(280, (p) => { tick.style.opacity = p; tm.setAttribute("opacity", 1 - p); }, easeOutCubic);
    await tween(420, (p) => { dl.style.opacity = p; dl.style.transform = `translateY(${12 * (1 - p)}px)`; }, easeOutQuint);
    await wait(500);

    // 5 → 6 — the scanner sweeps the QR, down and back up, twice
    const scan = $("#scan"), qr = box($("#e-qr"), layE);
    const line = scan.querySelector("rect"), lineY = +line.getAttribute("y");
    const glow = line.cloneNode(); glow.setAttribute("filter", "url(#scan-glow)");
    glow.setAttribute("height", 5); glow.setAttribute("opacity", 0.55);
    line.parentNode.insertBefore(glow, line);
    const top = qr.y - lineY, bottom = qr.y + qr.h - 2 - lineY;
    const at = (y) => { line.setAttribute("transform", `translate(0 ${y})`); glow.setAttribute("transform", `translate(0 ${y - 1.5})`); };
    at(top);
    await tween(180, (p) => (scan.style.opacity = p));
    for (const [a, b] of [[top, bottom], [bottom, top], [top, bottom], [bottom, top]]) {
      await tween(520, (p) => at(lerp(a, b, p)), easeInOutSine);
    }
    await tween(160, (p) => (scan.style.opacity = 1 - p));

    // 6 → 7 — checked in: the code greys out, the badge pops, the tick draws
    const qr7 = $("#qr7"), badge = $("#chk-badge"), chk = $("#chk");
    const len = chk.getTotalLength();
    chk.style.strokeDasharray = len; chk.style.strokeDashoffset = len;
    tween(320, (p) => { qr7.style.opacity = p; $("#e-qr").style.opacity = 1 - p; }, easeOutCubic);
    tween(620, (p) => (badge.style.transform = `scale(${lerp(0.6, 1, spring(p))})`));
    await wait(200);
    await tween(420, (p) => (chk.style.strokeDashoffset = len * (1 - p)), easeOutCubic);

    // 7 holds for 2s, then the phone drops out of the frame and it all starts over
    await wait(2000);
    await tween(550, (p) => (rise.style.transform = `translateY(${420 * p}px)`), (t) => t * t * t);
  }

  return play();
  }

  // Loops. Starts when half of it is on screen (in the case study, when
  // scrolled to), and a new cycle only begins while it is in view.
  let visible = false, wake = null;
  new IntersectionObserver((entries) => {
    visible = entries[entries.length - 1].isIntersecting;
    if (visible && wake) { wake(); wake = null; }
  }, { threshold: 0.5 }).observe($(".frame"));
  const inView = () => (visible ? Promise.resolve() : new Promise((r) => { wake = r; }));

  (async () => {
    for (;;) {
      await inView();
      await cycle();
      $(".stage").replaceWith(pristine.cloneNode(true));
    }
  })();
})();
</script>
</body>
</html>
