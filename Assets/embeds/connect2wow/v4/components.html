<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connect2WOW — from one pill to a whole screen</title>
<link rel="stylesheet" href="case.css">
<script src="icons.js"></script>
<script src="case.js"></script>
<style>
  /* Components (11.A): a camera over the live prototype. It starts on one
     status pill (atom), pulls back to the crew row (molecule), the crew card
     (organism), then the whole work-order screen (template). The screen is
     the real prototype, so it stays sharp at every zoom. */
  .canvas { height: 392px; }
  .view { position: absolute; left: 0; top: 0; width: 600px; height: 340px; overflow: hidden; }
  .cam { position: absolute; left: 0; top: 0; width: 1440px; height: 900px; transform-origin: 0 0; transition: transform 1.4s cubic-bezier(.65, 0, .35, 1); will-change: transform; }
  .cam iframe { width: 1440px; height: 900px; border: 0; display: block; pointer-events: none; background: #fff; }
  .ring { position: absolute; border: 2px solid #DD6B20; border-radius: 8px; pointer-events: none; transition: all 1.4s cubic-bezier(.65, 0, .35, 1); }
  .legend { position: absolute; left: 32px; right: 32px; bottom: 14px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .legend span { font: 500 11px/1.3 "Figtree"; color: var(--pg-faint); padding-top: 8px; border-top: 2px solid var(--pg-mist-2); transition: color .3s, border-color .3s; }
  .legend span b { display: block; font-weight: 600; margin-bottom: 2px; }
  .legend span.is-on { color: var(--pg-ink); border-color: #DD6B20; }
  .fade { position: absolute; left: 0; right: 0; top: 0; height: 340px; background: #fff; transition: opacity .5s; pointer-events: none; }
  .ready .fade { opacity: 0; }
</style>
</head>
<body>
<div class="frame" id="f">
  <div class="canvas">
    <div class="view"><div class="cam" id="cam"><iframe id="app" title="" tabindex="-1" src="app/index.html?shot#/eng/work-orders/WO-214?as=ryan"></iframe><div class="ring" id="ring"></div></div><div class="fade"></div></div>
    <div class="legend" id="lg"><span><b>Atom</b>a status pill</span><span><b>Molecule</b>a crew row</span><span><b>Organism</b>the crew card</span><span><b>Template</b>the work order</span></div>
  </div>
</div>
<script>
  var cam = document.getElementById("cam"), ring = document.getElementById("ring"), lg = document.getElementById("lg").children, frame = document.getElementById("app"), B = [];
  /* Boxes in the prototype's own 1440 × 900 space. */
  function measure() {
    var d = frame.contentDocument; if (!d) return false;
    var pill = Array.prototype.filter.call(d.querySelectorAll(".card .pill"), function (p) { return /expired/i.test(p.textContent); })[0];
    if (!pill) return false;
    var row = pill.closest(".check"), card = pill.closest(".card");
    B = [pill, row, card].map(function (e) { var r = e.getBoundingClientRect(); return { x: r.left, y: r.top, w: r.width, h: r.height }; });
    B.push({ x: 0, y: 0, w: 1440, h: 900 });
    return true;
  }
  function focus(i) {
    var b = B[i], full = i === 3;
    var k = full ? Math.min(600 / 1440, 340 / 900) : Math.min(600 * .62 / b.w, 340 * .5 / b.h, 3.2);
    var tx = 300 - (b.x + b.w / 2) * k, ty = 170 - (b.y + b.h / 2) * k;
    if (full) { tx = (600 - 1440 * k) / 2; ty = 0; }
    cam.style.transform = "translate(" + tx + "px," + ty + "px) scale(" + k + ")";
    ring.style.left = b.x - 6 + "px"; ring.style.top = b.y - 6 + "px"; ring.style.width = b.w + 12 + "px"; ring.style.height = b.h + 12 + "px";
    ring.style.borderWidth = 2 / k + "px"; ring.style.borderRadius = 8 / k + "px"; ring.style.opacity = full ? 0 : 1;
    Array.prototype.forEach.call(lg, function (l, j) { l.classList.toggle("is-in", false); l.classList.toggle("is-on", j === i); });
  }
  var started = false;
  function start() {
    if (started) return;
    if (!measure()) { setTimeout(start, 150); return; }
    started = true; focus(0); document.getElementById("f").classList.add("ready");
    whenSeen(document.getElementById("f"), async function () { var i = 0; while (true) { await sleep(i === 3 ? 3400 : 2000); i = (i + 1) % 4; focus(i); } });
  }
  frame.addEventListener("load", function () { setTimeout(start, 120); });
</script>
</body>
</html>
