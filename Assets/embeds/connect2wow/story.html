<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="The Connect2WOW case study in two minutes: the problem, what we did and how it ended, told over the case's own visuals and the working prototype, with the designer's cursor at work.">
<title>Connect2WOW story</title>
<link rel="stylesheet" href="../story/player.css?v=13">
<style>
  /* Connect2WOW's scenes on the 1200 x 675 stage; its blue only where the
     product appears (v4/case.css). */
  :root { --c2w: #1F6FEB; --c2w-bg: #E8F0FE; --accent: #1F6FEB; }

  /* The desktop prototype (app/, 1440 x 900), in a window. */
  .win { border-radius: 14px; overflow: hidden; background: #fff; box-shadow: 0 1px 0 rgba(13,18,51,.04), 0 18px 40px -16px rgba(13,18,51,.25); }
  .win .bar3 { height: 26px; display: flex; align-items: center; gap: 6px; padding: 0 12px; background: #F3F6F8; }
  .win .bar3 i { width: 9px; height: 9px; border-radius: 50%; background: #D5DBE2; }
  .win .view { position: relative; overflow: hidden; }
  .win iframe { position: absolute; left: 0; top: 0; width: 1440px; height: 900px; border: 0; transform-origin: 0 0; pointer-events: none; transition: opacity .35s; }

  /* Three designers, one card: drifting apart. */
  .three { display: flex; gap: 24px; }
  .mini { width: 300px; padding: 20px; }
  .mini h4 { font: 600 18px/1.2 "Figtree"; color: var(--ink); }
  .mini p { margin-top: 6px; font: 500 15px/1.3 "Figtree"; color: var(--muted); }
  .mini .acts { display: flex; gap: 8px; margin-top: 16px; }
  .mini .acts span { height: 34px; padding: 0 14px; font: 600 14px/34px "Figtree"; }
  .who { margin-top: 10px; font: 600 13px/1 "Figtree"; letter-spacing: .04em; text-transform: uppercase; color: var(--faint); text-align: center; }

  /* Seven candidates, four modules. */
  .cands { display: flex; flex-wrap: wrap; gap: 12px; width: 1040px; }
  .cand { display: inline-flex; align-items: center; gap: 8px; height: 46px; padding: 0 18px; border-radius: 12px; background: #fff; box-shadow: inset 0 0 0 1.5px var(--line);
    font: 600 18px/1 "Figtree"; color: var(--ink); transition: background .3s, box-shadow .3s, color .3s; }
  .cand.mod { background: var(--c2w-bg); box-shadow: inset 0 0 0 1.5px rgba(31,111,235,.35); color: #0B3D91; }
  .cand.held { box-shadow: 0 12px 26px rgba(13,18,51,.18); }
  .cand small { font: 500 13px/1 "Figtree"; color: var(--faint); }
  .homes { display: grid; grid-template-columns: 1.6fr 1fr 1fr; gap: 14px; width: 1040px; }
  .home { min-height: 170px; padding: 16px; border-radius: 16px; background: #fff; }
  .home h4 { font: 600 16px/1.2 "Figtree"; color: var(--ink); }
  .home p { margin-top: 4px; font: 500 14px/1.3 "Figtree"; color: var(--faint); }
  .home .slot { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }

  .flows { display: flex; flex-direction: column; gap: 6px; margin-top: 14px; }
  .flow { align-self: flex-start; padding: 7px 12px; border-radius: 10px; background: #fff; box-shadow: inset 0 0 0 1.5px var(--line); font: 600 16px/1.2 "Figtree"; color: var(--muted); transition: background .3s, box-shadow .3s, color .3s; }
  .flow.lit { background: var(--c2w-bg); box-shadow: inset 0 0 0 1.5px rgba(31,111,235,.4); color: #0B3D91; }
  .q { padding: 22px 26px; font: 600 26px/1.3 "Figtree"; color: var(--ink); }
  .q i { font-style: normal; color: var(--c2w); }
  .count { font: 700 64px/1 "Figtree"; color: var(--ink); font-variant-numeric: tabular-nums; }

  .approve { height: 54px; padding: 0 28px; border-radius: 12px; background: var(--c2w); color: #fff; font: 600 19px/54px "Figtree"; transition: background .3s; }
  .approve.done { background: #008000; }
</style>
</head>
<body>
<div id="story"></div>
<script src="../story/player.js?v=13"></script>
<script>
(function () {
  "use strict";
  var K = Story.kit, $ = K.$, $$ = K.$$, put = K.put, frame = K.frame, rise = K.rise, centre = K.centre;

  // The prototype at a route, as someone (app/index.html#/<route>?as=<who>), w wide.
  function win(root, route, x, y, w, id) {
    var s = w / 1440, h = Math.round(900 * s);
    return put(root, '<div class="win"' + (id ? ' id="' + id + '"' : "") + '><div class="bar3"><i></i><i></i><i></i></div><div class="view" style="width:' + w + "px;height:" + h + 'px">' +
      '<iframe src="v4/app/index.html?shot#/' + route + '" tabindex="-1" aria-hidden="true" style="transform:scale(' + s + ')"></iframe></div></div>', x, y);
  }
  function go(w, route) { var f = $(w, "iframe"); try { f.contentWindow.location.hash = "#/" + route; } catch (e) { f.src = "v4/app/index.html?shot#/" + route; } }

  var scenes = {
    hook: function (root, api) {
      put(root, '<p class="kicker rise">Connect2WOW · enterprise ERP</p><h2 class="title rise" style="margin-top:18px">One product for the head office and the camp four hours north.</h2>', 80, 190, 470);
      frame(root, "v4/hero.html?play", 590, 140, 560, 367);
      $$(root, ".rise").forEach(function (e, i) { rise(api, e, .2 + i * .35); });
    },
    audiences: function (root, api) {
      put(root, '<p class="kicker" style="text-align:center">From head office to site</p>', 300, 60, 600);
      frame(root, "v4/audiences.html?play", 250, 100, 700, 397);
    },
    problem: function (root, api) {
      put(root, '<p class="kicker" style="text-align:center">Six tools, none talking to the rest</p>', 300, 50, 600);
      frame(root, "v4/problem.html?play", 270, 90, 660, 418);
    },
    team: function (root, api) {
      put(root, '<p class="kicker" style="text-align:center">The team</p>', 300, 200, 600);
      put(root, '<div class="roles"><div class="card role me rise">Me<small>Product designer</small></div><div class="card role rise">Niloufar Davoudi<small>Product designer</small></div><div class="card role rise">Mobina Hosseini<small>Product designer</small></div><div class="card role rise">Amir Tavakoli<small>Design director</small></div></div>', 0, 260, 1200);
    },
    research: function (root, api) {
      frame(root, "v4/persona.html?play", 60, 90, 600, 430);
      put(root, '<p class="kicker rise">Every module, one question</p><div class="card q rise" style="margin-top:16px">Does it own its own <i>records</i> and <i>work</i>?</div>', 720, 200, 420);
    },
    modules: function (root, api) {
      var C = [["HR", 1], ["HSE", 1], ["Courses", 1], ["Engineering", 1], ["Profile", 0], ["Connection", 0], ["Administration", 0]];
      put(root, '<p class="kicker">Seven candidates</p><div class="cands" style="margin-top:14px">' +
        C.map(function (c) { return '<span class="cand" data-k="' + c[0] + '" data-mod="' + c[1] + '">' + c[0] + "</span>"; }).join("") + "</div>", 80, 70, 1040);
      put(root, '<div class="homes">' +
        '<div class="home" data-home="mod"><h4>Modules</h4><p>They own their records and work</p><div class="slot"></div></div>' +
        '<div class="home" data-home="ws"><h4>Your workspace</h4><p>Everything personal</p><div class="slot"></div></div>' +
        '<div class="home" data-home="hr"><h4>Inside HR, and the admin console</h4><p>Partners · Administration</p><div class="slot"></div></div></div>', 80, 270, 1040);
    },
    components: function (root, api) {
      put(root, '<p class="kicker" style="text-align:center">The shared design system underneath</p>', 300, 50, 600);
      frame(root, "v4/components.html?play", 280, 90, 640, 418);
    },
    // My flows, in the real prototype: the cursor opens each as it's named.
    mine: function (root, api) {
      put(root, '<p class="kicker">My part</p><div class="flows">' +
        [["chat", "Chat & messaging"], ["cal", "Calendar"], ["pdf", "PDF editor"], ["word", "Word editor"], ["eng", "Engineering editor"], ["life", "Onboarding & offboarding"], ["reviews", "Performance reviews"], ["org", "Org chart"], ["hiring", "Job posting"], ["profile", "Profile"], ["public", "How others see you"]].map(function (f) {
          return '<span class="flow rise" data-f="' + f[0] + '">' + f[1] + "</span>";
        }).join("") + "</div>", 70, 60, 280);
      win(root, "home?as=sarah", 380, 70, 760, "w");
    },
    // Three designers' cards, made one.
    together: function (root, api) {
      put(root, '<p class="kicker" style="text-align:center">Three designers, one product</p>', 300, 120, 600);
      var cards = [
        ['border-radius:6px', '<span style="background:#1F6FEB;color:#fff;border-radius:4px">Approve</span><span style="box-shadow:inset 0 0 0 1px #CBD5E1;border-radius:4px">Decline</span>', "Designer A"],
        ['border-radius:18px', '<span style="background:#0F9D58;color:#fff;border-radius:18px">Accept</span><span style="color:#D53434">Reject</span>', "Designer B"],
        ['border-radius:10px', '<span style="background:#0D1233;color:#fff;border-radius:8px">OK</span><span style="background:#F1F5F9;border-radius:8px">Cancel</span>', "Designer C"]
      ];
      put(root, '<div class="three">' + cards.map(function (c) {
        return '<div><div class="card mini" style="' + c[0] + ';transition:border-radius .5s"><h4>Offboarding request</h4><p>Mark Rushmore · welder</p><div class="acts">' + c[1] + '</div></div><p class="who">' + c[2] + "</p></div>";
      }).join("") + "</div>", 102, 190);
      put(root, '<p class="sub rise" id="one" style="text-align:center;color:var(--ink)">One consistent product.</p>', 250, 470, 700);
    }
  };

  // The cursor walks the flow list, opening each in the prototype as it's said.
  function doc(w) { try { return $(w, "iframe").contentDocument; } catch (e) { return null; } }
  function walk(api, steps) {
    var w = $(api.root, "#w");
    $$(api.root, ".flow").forEach(function (e) { rise(api, e, .1); });
    api.cursor.show();
    steps.forEach(function (st) {
      var t = api.word(st[0]), el = $(api.root, '[data-f="' + st[1] + '"]'), p = centre(el, .5, .5);
      api.cursor.to(p[0], p[1], .4, Math.max(0, t - .45)); api.cursor.click(t);
      api.after(t + .05, function () { $$(api.root, ".flow").forEach(function (x) { x.classList.remove("lit"); }); el.classList.add("lit"); if (st[2]) st[2](w, doc(w)); });
    });
  }

  // The one card all three became (WOW's request card, as in the prototype).
  var ONE = '<span style="background:#1F6FEB;color:#fff;border-radius:8px">Approve</span><span style="box-shadow:inset 0 0 0 1px #CBD5E1;border-radius:8px">Decline</span>';

  var lines = [
    // ---- The problem
    { chapter: "problem", scene: "hook", text: "Connect2WOW was a work platform for Canada’s oil and gas industry, used by an HR manager in a Calgary office and a welder on a remote site alike.", hold: .3 },
    { chapter: "problem", scene: "problem", text: "Each team ran on its own tools: spreadsheets, paper forms, email and group chats.", hold: .6 },
    { chapter: "problem", scene: "audiences", text: "Nothing connected, and the people furthest from the office were the most cut off.", hold: .8 },

    // ---- What I did
    { chapter: "did", scene: "team", text: "I was one of three product designers.", hold: .4,
      cue: function (api) {
        var r = $$(api.root, ".role");
        r.forEach(function (e, i) { rise(api, e, .1 + i * .15); });
        var p = centre(r[0], .5, .6);
        api.cursor.show(); api.cursor.to(p[0], p[1], .7, .6); api.cursor.click(1.4);
        api.after(1.45, function () { r[0].classList.add("lit"); });
      } },
    { chapter: "did", scene: "research", text: "We started from research and tested every possible section against one question: does it own its own records and work?", hold: .4,
      cue: function (api) {
        api.cursor.hide();
        var r = $$(api.root, ".rise");
        rise(api, r[0], api.word("tested")); rise(api, r[1], api.word("question:"));
      } },
    { chapter: "did", scene: "modules", text: "Seven candidates became four clear modules: HR, safety, training and engineering.", hold: 4.2,
      cue: function (api) {
        var homes = { mod: $(api.root, '[data-home="mod"] .slot'), ws: $(api.root, '[data-home="ws"] .slot'), hr: $(api.root, '[data-home="hr"] .slot') };
        function chip(k) { return $(api.root, '[data-k="' + k + '"]'); }
        function carry(k, to, d, label) {
          var el = chip(k), a = centre(el, .3, .5), b = centre(homes[to], .25, .5);
          api.cursor.to(a[0], a[1], .5, d);
          api.cursor.grab(el, d + .55);
          api.cursor.to(b[0] + 30, b[1] + 10, .7, d + .6);
          api.cursor.drop(d + 1.35, function () { if (label) el.innerHTML = el.dataset.k + " <small>" + label + "</small>"; homes[to].appendChild(el); });
        }
        api.cursor.show();
        carry("Profile", "ws", .2);
        carry("Connection", "hr", 1.8, "→ Partners");
        carry("Administration", "hr", 3.4, "→ admin console");
        ["HR", "HSE", "Courses", "Engineering"].forEach(function (k, i) {
          api.after(5.1 + i * .2, function () { var el = chip(k); el.classList.add("mod"); homes.mod.appendChild(el); });
        });
      } },
    { chapter: "did", scene: "mine", text: "My part covered several flows: the whole chat and messaging inside the product, the calendar, and all three editors built into it, for PDFs, Word documents and engineering drawings.", hold: .6,
      cue: function (api) { walk(api, [
        ["chat", "chat", function (w, d) { var b = d && d.querySelector('[data-a="chat"]'); if (b) b.click(); }],
        ["calendar,", "cal", function (w) { go(w, "calendar?as=sarah"); }],
        ["PDFs,", "pdf", null],
        ["Word", "word", null],
        ["engineering", "eng", function (w) { go(w, "eng/drawings?as=ryan"); setTimeout(function () { var d = doc(w); var b = d && d.querySelector('[data-a="editor"]'); if (b) b.click(); }, 450); }]
      ]); } },
    { chapter: "did", text: "I also designed key parts of HR (onboarding, offboarding, performance reviews, the org chart and job posting), and the profile section, including how a person looks to others.", hold: 1,
      cue: function (api) { walk(api, [
        ["onboarding,", "life", function (w) { go(w, "hr/lifecycle?as=sarah"); }],
        ["performance", "reviews", function (w) { go(w, "hr/reviews?as=sarah"); }],
        ["org", "org", function (w) { go(w, "hr/org?as=sarah"); }],
        ["job", "hiring", function (w) { go(w, "hr/hiring?as=sarah"); }],
        ["profile", "profile", function (w) { go(w, "profile?as=sarah"); }],
        ["looks", "public", function (w) { go(w, "hr/people/mark?as=sarah"); }]
      ]); } },
    { chapter: "did", scene: "components", text: "And I helped build the shared design system underneath.", hold: 1.2, cue: function (api) { api.cursor.hide(); } },

    // ---- The outcome
    { chapter: "outcome", scene: "together", text: "We each led our own areas but made every structural decision together, so three designers built one consistent product.", hold: 1.8,
      cue: function (api) {
        var m = $$(api.root, ".mini"), t = api.word("three");
        m.forEach(function (c, i) {
          api.after(t + i * .25, function () { c.style.borderRadius = "12px"; $(c, ".acts").innerHTML = ONE; });
        });
        rise(api, $(api.root, "#one"), api.word("consistent") - .2);
      } }
  ];

  Story(document.getElementById("story"), {
    title: "Connect2WOW in about a minute",
    chapters: [{ id: "problem", label: "The problem" }, { id: "did", label: "What I did" }, { id: "outcome", label: "The outcome" }],
    lines: lines,
    scenes: scenes
  });
})();
</script>
</body>
</html>
