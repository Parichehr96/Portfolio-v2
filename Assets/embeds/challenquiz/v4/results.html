<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="New players who finished at least one game, over one month: 535 before, 1,451 after. Below it, the usability study before and after on four measures, each on its own scale, five players per version.">
<title>Challenquiz — results</title>
<link rel="stylesheet" href="cq.css">
<script src="cq.js"></script>
<style>
  .canvas { height: 500px; padding: 26px 28px 0; }
  .k { font: 600 10px/1 "Figtree"; letter-spacing: .08em; text-transform: uppercase; color: var(--pg-faint); }
  .head { display: flex; align-items: baseline; gap: 10px; margin-top: 8px; } .head .num { color: var(--cq-700); } .head .tag { position: relative; top: -6px; }
  .big { display: grid; grid-template-columns: 92px 1fr 64px; gap: 10px; align-items: center; margin-top: 10px; }
  .big span { font: 500 12px/1 "Figtree"; color: var(--pg-muted); } .big b { font: 600 15px/1 "Figtree"; text-align: right; }
  .track { height: 22px; } .bar { height: 22px; border-radius: 0 4px 4px 0; background: var(--cq-300); width: 0; transition: width 1.2s var(--ease); }
  .bar.now { background: var(--cq-700); }
  .study { margin-top: 28px; background: #fff; border-radius: 14px; box-shadow: 0 0 0 1px var(--pg-border); padding: 18px 18px 6px; position: relative; }
  .study .t { font: 600 14px/1 "Figtree"; } .study .s { font: 400 12px/1 "Figtree"; color: var(--pg-muted); margin: 6px 0 12px; }
  .leg { position: absolute; right: 18px; top: 18px; display: flex; gap: 12px; font: 500 11px/1 "Figtree"; color: var(--pg-muted); }
  .leg i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
  .row { display: grid; grid-template-columns: 146px 1fr; gap: 14px; align-items: center; height: 58px; border-top: 1px solid var(--pg-border); }
  .row .n b { display: block; font: 600 13px/1.2 "Figtree"; } .row .n span { font: 400 11px/1.3 "Figtree"; color: var(--pg-faint); }
  .plot { position: relative; height: 40px; margin-right: 16px; }
  .ax { position: absolute; left: 0; right: 0; top: 14px; height: 2px; background: var(--pg-frame-2); border-radius: 1px; }
  .ln { position: absolute; top: 13px; height: 4px; border-radius: 2px; background: var(--cq-300); transition: all 1s var(--ease); }
  .pt { position: absolute; top: 8px; width: 14px; height: 14px; border-radius: 50%; border: 2px solid #fff; margin-left: -7px; transition: left 1s var(--ease); box-shadow: 0 0 0 1px rgba(13,18,51,.08); }
  .pt.b { background: var(--cq-300); } .pt.a { background: var(--cq-700); }
  .lb { position: absolute; top: 26px; font: 600 11px/1 "Figtree"; transform: translateX(-50%); white-space: nowrap; transition: left 1s var(--ease); }
  .lb.b { color: var(--pg-muted); font-weight: 500; }
  .ends { position: absolute; top: -2px; font: 400 10px/1 "Figtree"; color: var(--pg-faint); } .ends.lt { left: 0; } .ends.rt { right: 0; }
</style></head><body>
<div class="frame" id="f"><div class="canvas">
  <div class="k">Over one month</div>
  <div class="head"><span class="num">1,451</span><span class="tag tag--pos">+171%</span><span class="cap">new players finished at least one game</span></div>
  <div class="big"><span>Before</span><div class="track"><div class="bar" id="b1" title="535 new players"></div></div><b>535</b></div>
  <div class="big"><span>After</span><div class="track"><div class="bar now" id="b2" title="1,451 new players"></div></div><b>1,451</b></div>
  <div class="study"><div class="t">Usability study, before and after</div><div class="s">Five players on each version · each row on its own scale · read as direction, not proof</div>
    <div class="leg"><span><i style="background:#B8ABDA"></i>Old game</span><span><i style="background:#5425A0"></i>Redesign</span></div><div id="rows"></div></div>
</div></div>
<script>
  /* [name, note, before, after, min, max, unit] */
  var M = [["Time to start a game", "seconds · lower is better", 127, 62, 0, 140, "s"], ["Finished cleanly", "share of players", 60, 100, 0, 100, "%"],
           ["Could find the game", "rating, 1–5", 2.4, 4.4, 1, 5, ""], ["Post-game satisfaction", "rating, 1–5", 1.6, 4.0, 1, 5, ""]];
  document.getElementById("rows").innerHTML = M.map(function (m, i) {
    return '<div class="row"><div class="n"><b>' + m[0] + "</b><span>" + m[1] + '</span></div><div class="plot" id="p' + i + '"><span class="ax"></span><span class="ends lt">' + m[4] + m[6] + '</span><span class="ends rt">' + m[5] + m[6] + '</span><span class="ln"></span><span class="pt b" title="Old game: ' + m[2] + m[6] + '"></span><span class="pt a" title="Redesign: ' + m[3] + m[6] + '"></span><span class="lb b"></span><span class="lb a"></span></div></div>';
  }).join("");
  function pos(m, v) { return (v - m[4]) / (m[5] - m[4]) * 100; }
  function place(final) {
    M.forEach(function (m, i) { var p = document.getElementById("p" + i), b = pos(m, m[2]), a = pos(m, final ? m[3] : m[2]);
      p.querySelector(".pt.b").style.left = b + "%"; p.querySelector(".pt.a").style.left = a + "%";
      var ln = p.querySelector(".ln"); ln.style.left = Math.min(a, b) + "%"; ln.style.width = Math.abs(a - b) + "%";
      var f = function (v) { return (m[6] === "" ? v.toFixed(1) : v) + m[6]; };
      var lb = p.querySelector(".lb.b"), la = p.querySelector(".lb.a"); lb.style.left = b + "%"; la.style.left = a + "%";
      lb.textContent = f(m[2]); la.textContent = final ? f(m[3]) : ""; });
  }
  place(false);
  whenSeen(document.getElementById("f"), function () {
    document.getElementById("b1").style.width = (535 / 1451 * 100) + "%";
    setTimeout(function () { document.getElementById("b2").style.width = "100%"; }, 300);
    setTimeout(function () { place(true); }, 900);
  });
</script></body></html>
