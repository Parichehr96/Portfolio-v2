<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Three moments, before and after. The old list, match and result show no one else; each flips to the redesign, where the other players are on screen.">
<title>Challenquiz — insight (A)</title>
<link rel="stylesheet" href="cq.css">
<script src="cq.js"></script>
<style>
  .canvas { height: 420px; }
  .cols { position: absolute; left: 24px; right: 24px; top: 24px; display: flex; justify-content: space-between; }
  .col { width: 172px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .k { font: 600 10px/1 "Figtree"; letter-spacing: .08em; text-transform: uppercase; color: var(--pg-faint); }
  .stack { position: relative; width: 130px; height: 282px; }
  .stack .phone { position: absolute; left: 0; top: 0; transition: opacity .6s, transform .7s var(--ease); }
  .stack .was { filter: grayscale(1); }
  .is-flip .stack .was { opacity: 0; transform: translateX(-14px) rotate(-3deg); }
  .stack .now { opacity: 0; transform: translateX(14px); } .is-flip .stack .now { opacity: 1; transform: none; }
  .who { font: 600 13px/1.3 "Figtree"; text-align: center; min-height: 34px; }
  .who.b { color: var(--pg-neg); } .who.a { color: var(--cq-700); display: none; }
  .is-flip .who.b { display: none; } .is-flip .who.a { display: block; }
</style></head><body>
<div class="frame" id="f"><div class="canvas"><button class="replay" id="r">↻ Replay</button><div class="cols" id="cols"></div></div></div>
<script>
  var C = [["In the list", 1, "home", "Other players on screen: none", "2 spots left · 3 friends played"],
           ["In the match", 5, "correct", "Other players on screen: none", "How the room answered, every question"],
           ["At the result", 6, "final", "Other players on screen: a count", "The whole room, ranked"]];
  document.getElementById("cols").innerHTML = C.map(function (c, i) {
    return '<div class="col"><span class="k">' + c[0] + '</span><div class="stack">' + old(c[1], 122, { style: "", id: "" }).replace('class="phone', 'class="phone was') +
      phone(c[2], 122).replace('class="phone', 'class="phone now') + '</div><div class="who b">' + c[3] + '</div><div class="who a">' + c[4] + "</div></div>";
  }).join("");
  var f = document.getElementById("f");
  async function run() { f.classList.remove("is-flip"); await sleep(1800); f.classList.add("is-flip"); }
  document.getElementById("r").onclick = run;
  whenSeen(f, run);
</script></body></html>
