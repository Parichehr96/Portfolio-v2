<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Lena's four verbs on the left light up one by one while the real prototype on the right shows the moment that answers each: Open, Play, Learn, Enjoy.">
<title>Challenquiz — cover (B)</title>
<link rel="stylesheet" href="cq.css">
<script src="cq.js"></script>
<style>
  .canvas { height: 393px; }
  .verbs { position: absolute; left: 48px; top: 70px; display: flex; flex-direction: column; gap: 14px; }
  .verb { display: flex; align-items: baseline; gap: 12px; opacity: .28; transition: opacity .45s, transform .45s var(--ease); }
  .verb b { font: 600 34px/1 "Figtree"; letter-spacing: -.02em; color: var(--cq-700); width: 112px; }
  .verb span { font: 400 14px/1.3 "Figtree"; color: var(--pg-muted); }
  .verb.on { opacity: 1; transform: translateX(6px); }
  .who { position: absolute; left: 48px; top: 34px; }
  #ph { position: absolute; right: 64px; top: 22px; }
  /* Mostly white; the purple lives only where the product is: a soft glow rising
     behind the phone, and the question cards' triangle pattern fading out of it. */
  .frame--cover { background: #fff; }
  .glow { position: absolute; left: 300px; top: -60px; width: 420px; height: 520px; pointer-events: none;
    background: radial-gradient(closest-side, rgba(134, 91, 238, .20), rgba(134, 91, 238, .07) 58%, rgba(134, 91, 238, 0));
    animation: breathe 7s ease-in-out infinite alternate; }
  @keyframes breathe { to { transform: translateY(14px) scale(1.04); opacity: .85; } }
  .tri { position: absolute; left: 330px; top: 0; width: 270px; height: 393px; pointer-events: none; opacity: .55;
    -webkit-mask-image: radial-gradient(circle at 60% 45%, #000 0, rgba(0,0,0,.6) 38%, transparent 70%);
            mask-image: radial-gradient(circle at 60% 45%, #000 0, rgba(0,0,0,.6) 38%, transparent 70%); }
  .verb.on b { text-shadow: 0 8px 24px rgba(134, 91, 238, .25); }
</style></head><body>
<div class="frame frame--cover" id="f"><div class="canvas" id="c">
  <span class="glow" aria-hidden="true"></span>
  <svg class="tri" aria-hidden="true" viewBox="0 0 270 393"><defs><pattern id="t" width="54" height="47" patternUnits="userSpaceOnUse">
    <path d="M27 4 L50 43 L4 43 Z" fill="none" stroke="#865BEE" stroke-opacity=".18" stroke-width="1"/></pattern></defs>
    <rect width="270" height="393" fill="url(#t)"/></svg>
  <div class="who eyebrow">What Lena wants from a game</div>
  <div class="verbs" id="verbs"></div>
  <div id="slot"></div>
</div></div>
<script>
  var M = ["ready", "correct", "wrong", "final"];
  document.getElementById("verbs").innerHTML = VERBS.map(function (v, i) { return '<div class="verb" id="v' + i + '"><b>' + v.t + "</b><span>" + v.d + "</span></div>"; }).join("");
  document.getElementById("slot").innerHTML = phone(M[0], 160, { id: "ph" });
  var ph = document.getElementById("ph"), i = 0;
  function show(n) { VERBS.forEach(function (_, k) { document.getElementById("v" + k).classList.toggle("on", k === n); }); if (n !== i || n === 0) setPhone(ph, M[n]); i = n; }
  whenSeen(document.getElementById("f"), async function () {
    document.getElementById("v0").classList.add("on");
    if (END) { show(3); return; }
    for (;;) { for (var n = 1; n <= 4; n++) { await sleep(2600); show(n % 4); } }
  });
</script></body></html>
