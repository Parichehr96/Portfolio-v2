<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="The Challenquiz case study in two minutes: the problem, what I did and the impact, told over the case's own visuals and the real prototype, with the designer's cursor at work.">
<title>Challenquiz story</title>
<link rel="stylesheet" href="../story/player.css?v=11">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  /* Challenquiz's scenes on the 1200 x 675 stage; its purple only where the
     product appears (v4/cq.css). */
  :root { --cq-700: #5425A0; --cq-500: #865BEE; --cq-200: #E7D9FF; --cq-100: #F6F2FD; --accent: #865BEE; }

  /* A phone: the real prototype (v2, ?state=…&bare) or a still of the old app. */
  .phone { position: relative; border-radius: 30px; background: #0b0b10; padding: 6px; box-shadow: 0 24px 44px -22px rgba(21, 7, 43, .5); transition: transform .6s var(--e-out), opacity .4s; }
  .phone .scr { position: relative; overflow: hidden; border-radius: 24px; background: #fff; }
  .phone iframe { position: absolute; left: 0; top: 0; width: 393px; height: 852px; border: 0; transform-origin: 0 0; pointer-events: none; transition: opacity .35s; }
  .phone img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: top; transition: opacity .35s; }
  .badge { position: absolute; z-index: 2; white-space: nowrap; }

  .facts { display: grid; gap: 12px; }
  .fact { display: flex; align-items: center; gap: 12px; font: 500 21px/1.3 "Figtree"; color: var(--ink); }
  .fact i { flex: none; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: rgba(213,52,52,.1); color: #D53434; font: 700 15px/1 "Figtree"; font-style: normal; }

  .lena { width: 360px; padding: 26px 28px; }
  .lena b { font: 700 34px/1.1 "Baloo 2", "Figtree"; color: var(--cq-700); }
  .lena p { margin-top: 10px; font: 500 18px/1.45 "Figtree"; color: var(--muted); }
  .verbs { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; width: 560px; }
  .verb { padding: 20px 22px; transition: box-shadow .35s, background .35s; }
  .verb b { display: block; font: 700 30px/1 "Baloo 2", "Figtree"; color: var(--cq-700); }
  .verb span { display: block; margin-top: 8px; font: 500 17px/1.2 "Figtree"; color: var(--muted); }
  .verb.lit { background: var(--cq-100); box-shadow: inset 0 0 0 2px var(--cq-500); }

  .bars { display: flex; align-items: flex-end; gap: 28px; height: 300px; }
  .colbar { width: 120px; border-radius: 14px 14px 6px 6px; background: var(--cq-200); height: 0; transition: height 1.2s var(--e-out); }
  .colbar.after { background: var(--cq-500); }
  .bars figcaption { text-align: center; margin-top: 10px; font: 500 16px/1.2 "Figtree"; color: var(--muted); }
  .bigcount { font: 700 84px/1 "Figtree"; color: var(--ink); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }

  .play-again { height: 54px; padding: 0 28px; border-radius: 999px; background: var(--cq-500); color: #fff; font: 700 21px/54px "Baloo 2", "Figtree"; transition: background .3s; }
  .play-again.done { background: #008000; }
</style>
</head>
<body>
<div id="story"></div>
<script src="../story/player.js?v=11"></script>
<script>
(function () {
  "use strict";
  var K = Story.kit, $ = K.$, $$ = K.$$, put = K.put, frame = K.frame, rise = K.rise, centre = K.centre;
  var APP = "v2/index.html";

  // A phone, w wide: the prototype at a state, or an old still ("old-5").
  function phone(root, what, x, y, w, id) {
    var h = Math.round(w * 852 / 393), s = w / 393;
    var inner = /^old-/.test(what)
      ? '<img src="v4/img/' + what + '.png" alt="">'
      : '<iframe src="' + APP + "?state=" + what + '&bare" tabindex="-1" aria-hidden="true" style="transform:scale(' + s + ')"></iframe>';
    return put(root, '<div class="phone"' + (id ? ' id="' + id + '"' : "") + '><div class="scr" style="width:' + w + "px;height:" + h + 'px">' + inner + "</div></div>", x, y);
  }
  // Swap what a phone shows, with a short crossfade.
  function swap(ph, what) {
    var scr = $(ph, ".scr"), old = scr.lastElementChild, w = scr.offsetWidth, s = w / 393, el;
    if (/^old-/.test(what)) { el = document.createElement("img"); el.src = "v4/img/" + what + ".png"; el.alt = ""; }
    else { el = document.createElement("iframe"); el.src = APP + "?state=" + what + "&bare"; el.tabIndex = -1; el.style.transform = "scale(" + s + ")"; }
    el.style.opacity = 0;
    scr.appendChild(el);
    setTimeout(function () { el.style.opacity = 1; setTimeout(function () { if (old && old.parentNode) old.remove(); }, 400); }, 250);
  }

  var scenes = {
    hook: function (root, api) {
      put(root, '<p class="kicker rise">Challenquiz · Telegram Mini App</p><h2 class="title rise" style="margin-top:18px">Live trivia, with something at stake.</h2>' +
        '<p class="sub rise" style="margin-top:22px">Built as a multiplayer game. On screen, everyone played alone.</p>', 80, 190, 560);
      phone(root, "old-1", 780, 50, 220, "ph");
      put(root, '<span class="tag neg rise" id="alone">1 player on screen</span>', 1010, 120).classList.add("badge");
      $$(root, ".rise").slice(0, 2).forEach(function (e, i) { rise(api, e, .2 + i * .35); });
    },
    old: function (root, api) {
      frame(root, "v4/oldflow.html?play", 60, 80, 600, 393);
      put(root, '<p class="kicker">The old game, step by step</p><div class="facts" style="margin-top:22px">' +
        ["A stack of identical cards", "A six-point rulebook", "An empty lobby", "No opponent in sight", "“Please wait until other players answer”"].map(function (f, i) { return '<div class="fact rise"><i>' + (i + 1) + "</i>" + f + "</div>"; }).join("") +
        "</div>", 720, 110, 440);
    },
    wait: function (root, api) {
      put(root, '<p class="kicker" style="text-align:center">The end of every game</p>', 300, 50, 600);
      phone(root, "old-6", 490, 80, 220, "ph");
      put(root, '<p class="sub rise" id="gone" style="text-align:center">The best moment arrived after most people had left.</p>', 250, 300, 700);
    },
    heard: function (root, api) {
      put(root, '<p class="kicker rise">Five players, tested on the old game</p>', 80, 80);
      var Q = [
        ["Sam", "First-time Web3 player", "“It just looked like <span class=\"mark\">the same game listed over and over</span>.”"],
        ["Iris", "Competitive quizzer", "“It said two players, but <span class=\"mark\">I never saw the other one</span>.”"],
        ["Ravi", "Skeptical and cautious", "“I answered everything and it just said wait. <span class=\"mark\">I closed it</span>.”"]
      ];
      put(root, '<div style="display:flex;gap:20px">' + Q.map(function (q) {
        return '<div class="card quote rise"><p>' + q[2] + "</p><small>" + q[0] + " · " + q[1] + "</small></div>";
      }).join("") + "</div>", 80, 140);
    },
    insight: function (root, api) {
      put(root, '<p class="kicker" style="text-align:center">The other players, hidden at every step</p>', 300, 40, 600);
      frame(root, "v4/insight.html?play", 280, 80, 640, 448);
    },
    team: function (root, api) {
      put(root, '<p class="kicker" style="text-align:center">The team</p>', 300, 200, 600);
      put(root, '<div class="roles"><div class="card role me rise">Me<small>Sole product designer</small></div><div class="card role rise">The founder<small>Product owner</small></div><div class="card role rise">2 developers<small>Mini App &amp; backend</small></div></div>', 0, 260, 1200);
    },
    lena: function (root, api) {
      put(root, '<div class="card lena rise"><p class="kicker">The player I designed for</p><b style="display:block;margin-top:12px">Lena</b><p>Loves quiz games, isn’t Web3-savvy, plays on her phone in the gaps of her day.</p></div>', 80, 150);
      put(root, '<div class="verbs">' + [["Open", "into a game, fast"], ["Play", "against someone"], ["Learn", "something new"], ["Enjoy", "how it ended"]].map(function (v) {
        return '<div class="card verb rise"><b>' + v[0] + "</b><span>" + v[1] + "</span></div>";
      }).join("") + "</div>", 560, 150);
    },
    rooms: function (root, api) {
      put(root, '<p class="kicker" style="text-align:center">Three ways a room could work</p>', 300, 40, 600);
      frame(root, "v4/rooms.html?play", 270, 80, 660, 444);
    },
    play: function (root, api) {
      phone(root, "question", 220, 50, 220, "ph");
      put(root, '<p class="kicker rise">In the match</p><h3 class="title rise" style="margin-top:16px;font-size:40px">After every answer, you see how the room answered.</h3>', 560, 200, 540);
    },
    result: function (root, api) {
      put(root, '<p class="kicker" style="text-align:center">At the result</p>', 300, 40, 600);
      frame(root, "v4/reward.html?play", 270, 80, 660, 473);
    },
    impact: function (root, api) {
      put(root, '<p class="kicker rise">New players who finished a game, in one month</p><p class="bigcount rise" style="margin-top:14px"><span id="n">535</span></p><p class="sub rise" style="margin-top:6px">from 535</p>', 80, 90, 520);
      put(root, '<div class="bars rise" id="bars"><figure><div class="colbar" id="b1"></div><figcaption>Before</figcaption></figure><figure><div class="colbar after" id="b2"></div><figcaption>After</figcaption></figure></div>', 760, 40);
      put(root, '<div style="display:flex;gap:20px">' +
        '<div class="card metric rise" id="m1"><div class="num">~127s</div><div class="lbl">Time to start a game</div><div class="from"><span class="tag pos">halved</span></div></div>' +
        '<div class="card metric rise" id="m2"><div class="num">60%</div><div class="lbl">Games finished cleanly</div><div class="from"><span class="tag pos">every one</span></div></div>' +
        '<div class="card metric rise" id="m3"><div class="num">1.6/5</div><div class="lbl">Post-game satisfaction</div><div class="from"><span class="tag pos">more than doubled</span></div></div></div>', 80, 380);
    },
    close: function (root, api) {
      put(root, '<p class="claim"><span>I design for the moment people come back for,</span> <span>and I put it back on screen.</span></p>', 170, 190);
      put(root, '<div style="text-align:center"><button class="play-again" type="button" tabindex="-1">Play again</button></div>', 0, 400, 1200);
    }
  };

  // The cursor marks a quote's key words.
  function markQuote(api, card, d) {
    var m = $(card, ".mark"), a = centre(m, 0, .75), b = centre(m, 1, .75);
    api.cursor.to(a[0], a[1], .7, d);
    api.tween(1, function (p) { m.style.setProperty("--m", p); }, d + .8);
    api.cursor.to(b[0], b[1], 1, d + .8);
  }

  var lines = [
    // ---- The problem
    { chapter: "problem", scene: "hook", text: "Challenquiz is live trivia on Telegram with something at stake: you pay to take a seat, answer ten questions, and the best players in the room win the most." },
    { chapter: "problem", text: "It was built as a multiplayer game." },
    { chapter: "problem", text: "On screen, everyone played alone.",
      cue: function (api) {
        rise(api, $$(api.root, ".rise")[2], .1);
        api.after(.3, function () { swap($(api.root, "#ph"), "old-5"); });
        rise(api, $(api.root, "#alone"), .9);
      } },
    { chapter: "problem", scene: "old", text: "You picked a match from a stack of identical cards, read a six-point rulebook, waited in an empty lobby, answered with no opponent in sight, and finished on “please wait until other players answer”.",
      cue: function (api) { var w = ["identical", "rulebook,", "lobby,", "opponent", "finished"]; $$(api.root, ".fact").forEach(function (f, i) { rise(api, f, api.word(w[i])); }); } },
    { chapter: "problem", scene: "wait", text: "The best moment of the game, finding out whether you won, arrived after most people had already closed the app.", hold: .4,
      cue: function (api) {
        var ph = $(api.root, "#ph"), p = centre(ph, .5, .02);
        api.cursor.show();
        // A swipe down to close the Mini App, as a player gives up waiting.
        api.cursor.to(p[0], p[1] + 20, .9, 1.4);
        api.after(2.4, function () { api.cursor.grab(ph); });
        api.cursor.to(p[0], p[1] + 260, .8, 2.45);
        api.after(3.0, function () { ph.style.opacity = "0"; });
        api.cursor.drop(3.3);
        rise(api, $(api.root, "#gone"), 3.4);
      } },
    { chapter: "problem", scene: "heard", text: "I tested it with five players.", cue: function (api) { api.cursor.hide(); rise(api, $(api.root, ".kicker"), .1); } },
    { chapter: "problem", text: "They couldn’t tell the matches apart, never saw who they were playing against, and left before the result.", hold: .6,
      cue: function (api) {
        var q = $$(api.root, ".quote");
        api.cursor.show();
        rise(api, q[0], .1); markQuote(api, q[0], .4);
        rise(api, q[1], 2.0); markQuote(api, q[1], 2.3);
        rise(api, q[2], 4.0); markQuote(api, q[2], 4.3);
      } },
    { chapter: "problem", scene: "insight", text: "The other players were the whole point of the product, and the interface hid them at every step.", hold: 1.2, cue: function (api) { api.cursor.hide(); } },

    // ---- What I did
    { chapter: "did", scene: "team", text: "I was the only designer, with the founder and two developers.",
      cue: function (api) {
        var r = $$(api.root, ".role");
        r.forEach(function (e, i) { rise(api, e, .2 + i * .3); });
        var p = centre(r[0], .5, .6);
        api.cursor.show(); api.cursor.to(p[0], p[1], .9, 1.2); api.cursor.click(2.2);
        api.after(2.25, function () { r[0].classList.add("lit"); });
      } },
    { chapter: "did", scene: "lena", text: "I designed the game around one player, Lena, and four things she wanted: to open it and play fast, to play against someone, to learn something, and to enjoy the result.",
      cue: function (api) {
        rise(api, $(api.root, ".lena"), .2);
        var v = $$(api.root, ".verb");
        v.forEach(function (e) { rise(api, e, api.word("four")); });
        ["open", "against", "learn", "enjoy"].map(api.word).forEach(function (d, i) {
          var p = centre(v[i], .25, .4);
          api.cursor.to(p[0], p[1], .6, d - .6); api.cursor.click(d);
          api.after(d + .05, function () { v[i].classList.add("lit"); });
        });
      } },
    { chapter: "did", scene: "rooms", text: "Rooms now feel live without making anyone wait.", hold: 1.4, cue: function (api) { api.cursor.hide(); } },
    { chapter: "did", scene: "play", text: "After every answer you see how the room answered.", hold: 1.2,
      cue: function (api) {
        var ph = $(api.root, "#ph"), p = centre(ph, .5, .62);
        $$(api.root, ".rise").forEach(function (e, i) { rise(api, e, .2 + i * .3); });
        api.cursor.show(); api.cursor.to(p[0], p[1], .9, .4); api.cursor.click(1.4);
        api.after(1.5, function () { swap(ph, "correct"); });
      } },
    { chapter: "did", scene: "result", text: "And the result lands the moment you finish, with a breakdown of exactly what you earned and why.", hold: 2.2, cue: function (api) { api.cursor.hide(); } },

    // ---- The impact
    { chapter: "impact", scene: "impact", text: "In one month, new players who finished a game nearly tripled, from 535 to 1,451.", hold: .6,
      cue: function (api) {
        $$(api.root, ".rise").slice(0, 4).forEach(function (e) { rise(api, e, .1); });
        api.after(.4, function () { $(api.root, "#b1").style.height = "100px"; });
        api.after(1.4, function () { $(api.root, "#b2").style.height = "271px"; });
        api.count($(api.root, "#n"), 535, 1451, 2.4, null, 1.2);
      } },
    { chapter: "impact", text: "In testing with five more players, time to start halved, every game finished cleanly, and satisfaction more than doubled.", hold: 1,
      cue: function (api) {
        var m1 = $(api.root, "#m1"), m2 = $(api.root, "#m2"), m3 = $(api.root, "#m3");
        rise(api, m1, .6); api.count($(m1, ".num"), 127, 62, 1.2, function (v) { return "~" + Math.round(v) + "s"; }, 1.0);
        rise(api, m2, 2.6); api.count($(m2, ".num"), 60, 100, 1.2, function (v) { return Math.round(v) + "%"; }, 3.0);
        rise(api, m3, 4.4); api.count($(m3, ".num"), 1.6, 4.0, 1.2, function (v) { return v.toFixed(1) + "/5"; }, 4.8);
      } },
    { chapter: "impact", scene: "close", text: "I design for the moment people come back for, and I put it back on screen.", hold: 1.8,
      cue: function (api) {
        var s = $$(api.root, ".claim span");
        s.forEach(function (e, i) { api.after(.3 + i * 2.2, function () { e.classList.add("lit"); }); });
        var b = $(api.root, ".play-again"), p = centre(b, .5, .6);
        api.cursor.show(); api.cursor.to(p[0], p[1], 1, 3.6); api.cursor.click(4.7);
        api.after(4.75, function () { b.classList.add("done"); b.textContent = "Seat taken ✓"; });
      } }
  ];

  Story(document.getElementById("story"), {
    title: "Challenquiz in two minutes",
    chapters: [{ id: "problem", label: "The problem" }, { id: "did", label: "What I did" }, { id: "impact", label: "The impact" }],
    lines: lines,
    scenes: scenes
  });
})();
</script>
</body>
</html>
