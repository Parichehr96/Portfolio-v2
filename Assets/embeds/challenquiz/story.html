<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="The Challenquiz case study in two minutes: the problem, what I did and the impact, told over the case's own visuals and the real prototype, with the designer's cursor at work.">
<title>Challenquiz story</title>
<link rel="stylesheet" href="../story/player.css?v=14">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  /* Challenquiz's scenes on the 1200 x 675 stage; its purple only where the
     product appears (v4/cq.css). */
  :root { --cq-700: #5425A0; --cq-500: #865BEE; --cq-200: #E7D9FF; --cq-100: #F6F2FD; --accent: #865BEE; }

  /* A phone: the real prototype (v2, ?state=…&bare) or a still of the old app. */
  .phone { position: relative; border-radius: 30px; background: #0b0b10; padding: 6px; box-shadow: 0 24px 44px -22px rgba(21, 7, 43, .5); transition: transform .6s var(--e-out), opacity .4s; }
  .phone .scr { position: relative; overflow: hidden; border-radius: 24px; background: #fff; }
  .phone iframe { position: absolute; left: 0; top: 0; width: 393px; height: 852px; border: 0; transform-origin: 0 0; pointer-events: none; transition: opacity .35s; }
  .phone img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: top; transition: opacity .35s; }
  .badge { position: absolute; z-index: 2; white-space: nowrap; }

  .facts { display: grid; gap: 12px; }
  .fact { display: flex; align-items: center; gap: 12px; font: 500 21px/1.3 "Figtree"; color: var(--ink); }
  .fact i { flex: none; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: rgba(213,52,52,.1); color: #D53434; font: 700 15px/1 "Figtree"; font-style: normal; }

  .lena { width: 360px; padding: 26px 28px; }
  .lena b { font: 700 34px/1.1 "Baloo 2", "Figtree"; color: var(--cq-700); }
  .lena p { margin-top: 10px; font: 500 18px/1.45 "Figtree"; color: var(--muted); }
  .verbs { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; width: 560px; }
  .verb { padding: 20px 22px; transition: box-shadow .35s, background .35s; }
  .verb b { display: block; font: 700 30px/1 "Baloo 2", "Figtree"; color: var(--cq-700); }
  .verb span { display: block; margin-top: 8px; font: 500 17px/1.2 "Figtree"; color: var(--muted); }
  .verb.lit { background: var(--cq-100); box-shadow: inset 0 0 0 2px var(--cq-500); }

  .bars { display: flex; align-items: flex-end; gap: 28px; height: 300px; }
  .loop { display: flex; align-items: center; justify-content: center; gap: 18px; }
  .node { width: 250px; min-height: 120px; padding: 22px; display: flex; flex-direction: column; justify-content: space-between; gap: 14px; }
  .node b { font: 600 21px/1.3 "Figtree"; color: var(--ink); }
  .mini-btn { align-self: flex-start; height: 36px; padding: 0 14px; border-radius: 10px; background: var(--cq-500); color: #fff; font: 700 16px/36px "Baloo 2", "Figtree"; transition: background .3s; }
  .mini-btn.done { background: #008000; }
  .arr { width: 44px; height: 2px; background: var(--cq-500); position: relative; }
  .arr::after { content: ""; position: absolute; right: -2px; top: -5px; border: 6px solid transparent; border-left: 9px solid var(--cq-500); border-right: 0; }
  .olds { display: flex; justify-content: center; gap: 56px; }
  .oldph { display: flex; flex-direction: column; align-items: center; gap: 14px; margin: 0; }
  .colbar { width: 120px; border-radius: 14px 14px 6px 6px; background: var(--cq-200); height: 0; transition: height 1.2s var(--e-out); }
  .colbar.after { background: var(--cq-500); }
  .bars figcaption { text-align: center; margin-top: 10px; font: 500 16px/1.2 "Figtree"; color: var(--muted); }
  .bigcount { font: 700 84px/1 "Figtree"; color: var(--ink); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }

  .play-again { height: 54px; padding: 0 28px; border-radius: 999px; background: var(--cq-500); color: #fff; font: 700 21px/54px "Baloo 2", "Figtree"; transition: background .3s; }
  .play-again.done { background: #008000; }
</style>
</head>
<body>
<div id="story"></div>
<script src="../story/player.js?v=14"></script>
<script>
(function () {
  "use strict";
  var K = Story.kit, $ = K.$, $$ = K.$$, put = K.put, frame = K.frame, rise = K.rise, centre = K.centre;
  var APP = "v2/index.html";

  // A phone, w wide: the prototype at a state, or an old still ("old-5").
  function phone(root, what, x, y, w, id) {
    var h = Math.round(w * 852 / 393), s = w / 393;
    var inner = /^old-/.test(what)
      ? '<img src="v4/img/' + what + '.png" alt="">'
      : '<iframe src="' + APP + "?state=" + what + '&bare" tabindex="-1" aria-hidden="true" style="transform:scale(' + s + ')"></iframe>';
    return put(root, '<div class="phone"' + (id ? ' id="' + id + '"' : "") + '><div class="scr" style="width:' + w + "px;height:" + h + 'px">' + inner + "</div></div>", x, y);
  }
  // Swap what a phone shows, with a short crossfade.
  function swap(ph, what) {
    var scr = $(ph, ".scr"), old = scr.lastElementChild, w = scr.offsetWidth, s = w / 393, el;
    if (/^old-/.test(what)) { el = document.createElement("img"); el.src = "v4/img/" + what + ".png"; el.alt = ""; }
    else { el = document.createElement("iframe"); el.src = APP + "?state=" + what + "&bare"; el.tabIndex = -1; el.style.transform = "scale(" + s + ")"; }
    el.style.opacity = 0;
    scr.appendChild(el);
    setTimeout(function () { el.style.opacity = 1; setTimeout(function () { if (old && old.parentNode) old.remove(); }, 400); }, 250);
  }

  var scenes = {
    hook: function (root, api) {
      put(root, '<p class="kicker rise">Challenquiz · Telegram Mini App</p><h2 class="title rise" style="margin-top:18px">A quiz game where you play other people, for tokens.</h2>', 80, 210, 560);
      phone(root, "home", 780, 50, 220, "ph");
      $$(root, ".rise").forEach(function (e, i) { rise(api, e, .2 + i * .35); });
    },
    // Why the first match matters.
    growth: function (root, api) {
      put(root, '<p class="kicker" style="text-align:center">How Challenquiz grows</p>', 300, 110, 600);
      put(root, '<div class="loop">' +
        '<div class="card node rise"><b>A new player joins a room</b><span class="mini-btn">Take a seat</span></div><i class="arr rise"></i>' +
        '<div class="card node rise"><b>Finishes their first match</b></div><i class="arr rise"></i>' +
        '<div class="card node rise"><b>Wants another one</b></div></div>', 0, 210, 1200);
      put(root, '<svg class="rise" id="ret" width="840" height="120" viewBox="0 0 840 120" fill="none"><path d="M760 6 C760 96 80 96 80 6" stroke="#865BEE" stroke-width="2.5" stroke-dasharray="6 7" stroke-linecap="round"/><path d="M70 18 80 4 92 16" stroke="#865BEE" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>', 180, 360, 840);
    },
    // Never anyone else: three moments of the old game.
    alone: function (root, api) {
      put(root, '<p class="kicker" style="text-align:center">The old game</p>', 300, 40, 600);
      put(root, '<div class="olds">' + [["old-1", "Identical matches"], ["old-5", "Answering alone"], ["old-6", "“Please wait”"]].map(function (o) {
        return '<figure class="oldph rise"><div class="phone"><div class="scr" style="width:200px;height:434px"><img src="v4/img/' + o[0] + '.png" alt=""></div></div><figcaption class="tag neg">' + o[1] + "</figcaption></figure>";
      }).join("") + "</div>", 0, 80, 1200);
    },
    wait: function (root, api) {
      put(root, '<p class="kicker" style="text-align:center">The end of every game</p>', 300, 50, 600);
      phone(root, "old-6", 490, 80, 220, "ph");
      put(root, '<p class="sub rise" id="gone" style="text-align:center">The best moment arrived after most people had left.</p>', 250, 300, 700);
    },
    team: function (root, api) {
      put(root, '<p class="kicker" style="text-align:center">The team</p>', 300, 200, 600);
      put(root, '<div class="roles"><div class="card role me rise">Me<small>Sole product designer</small></div><div class="card role rise">The founder<small>Product owner</small></div><div class="card role rise">2 developers<small>Mini App &amp; backend</small></div></div>', 0, 260, 1200);
    },
    lena: function (root, api) {
      put(root, '<div class="card lena rise"><p class="kicker">Tested with five players · designed for</p><b style="display:block;margin-top:12px">Lena</b><p>Loves quiz games, isn’t Web3-savvy, plays on her phone in the gaps of her day.</p></div>', 80, 150);
      put(root, '<div class="verbs">' + [["Open", "into a game, fast"], ["Play", "against someone"], ["Learn", "something new"], ["Enjoy", "how it ended"]].map(function (v) {
        return '<div class="card verb rise"><b>' + v[0] + "</b><span>" + v[1] + "</span></div>";
      }).join("") + "</div>", 560, 150);
    },
    rooms: function (root, api) {
      put(root, '<p class="kicker" style="text-align:center">Three ways a room could work</p>', 300, 40, 600);
      frame(root, "v4/rooms.html?play", 270, 80, 660, 444);
    },
    play: function (root, api) {
      phone(root, "question", 220, 50, 220, "ph");
      put(root, '<p class="kicker rise">In the match</p><h3 class="title rise" style="margin-top:16px;font-size:40px">After every answer, you see how the room answered.</h3>', 560, 200, 540);
    },
    result: function (root, api) {
      put(root, '<p class="kicker" style="text-align:center">At the result</p>', 300, 40, 600);
      frame(root, "v4/reward.html?play", 270, 80, 660, 473);
    },
    // The results as cards with their change in green (as ONTON's), the
    // month's number large with its two bars.
    impact: function (root, api) {
      put(root, '<p class="kicker rise">New players who finished a game, in one month</p><p class="bigcount rise" style="margin-top:14px"><span id="n">535</span></p><div class="from rise" style="margin-top:12px"><span class="tag pos">from 535 · almost tripled</span></div>', 80, 80, 600);
      put(root, '<div class="bars rise" id="bars"><figure><div class="colbar" id="b1"></div><figcaption>Before</figcaption></figure><figure><div class="colbar after" id="b2"></div><figcaption>After</figcaption></figure></div>', 760, 40);
      put(root, '<div style="display:flex;gap:20px">' +
        '<div class="card metric rise" id="m1"><div class="num">~127s</div><div class="lbl">Time to start a game</div><div class="from"><span class="tag pos">halved, from ~127s</span></div></div>' +
        '<div class="card metric rise" id="m2"><div class="num">60%</div><div class="lbl">Games finished cleanly</div><div class="from"><span class="tag pos">from 60%</span></div></div></div>', 80, 380);
    }
  };

  var lines = [
    // ---- The problem
    { chapter: "problem", scene: "hook", text: "Challenquiz is a quiz game on Telegram where you play against other people for tokens.", hold: .3 },
    { chapter: "problem", scene: "growth", text: "The game only grows if new players finish their first match and want another.", hold: .4,
      cue: function (api) {
        var n = $$(api.root, ".node"), a = $$(api.root, ".arr"), btn = $(api.root, ".mini-btn"), p = centre(btn);
        rise(api, n[0], .1);
        api.cursor.show(); api.cursor.to(p[0], p[1], .7, .3); api.cursor.click(1.1);
        api.after(1.15, function () { btn.classList.add("done"); btn.textContent = "Seat taken ✓"; });
        rise(api, a[0], api.word("finish") - .3); rise(api, n[1], api.word("finish"));
        rise(api, a[1], api.word("want") - .3); rise(api, n[2], api.word("want")); rise(api, $(api.root, "#ret"), api.word("another."));
        api.after(2.2, function () { api.cursor.hide(); });
      } },
    { chapter: "problem", scene: "alone", text: "But on screen you never saw anyone else: the matches looked identical, you answered alone, and the game ended on “please wait”.",
      cue: function (api) {
        var o = $$(api.root, ".oldph");
        rise(api, o[0], api.word("identical,") - .3); rise(api, o[1], api.word("alone,") - .4); rise(api, o[2], api.word("ended") - .2);
      } },
    { chapter: "problem", scene: "wait", text: "Most players left before finding out if they’d won.", hold: .8,
      cue: function (api) {
        var ph = $(api.root, "#ph"), p = centre(ph, .5, .02);
        api.cursor.show();
        api.cursor.to(p[0], p[1] + 20, .7, .3);
        api.after(1.05, function () { api.cursor.grab(ph); });
        api.cursor.to(p[0], p[1] + 260, .7, 1.1);
        api.after(1.6, function () { ph.style.opacity = "0"; });
        api.cursor.drop(1.9);
        rise(api, $(api.root, "#gone"), 2.0);
      } },

    // ---- What I did
    { chapter: "did", scene: "team", text: "I was the only designer.", hold: .6,
      cue: function (api) {
        var r = $$(api.root, ".role");
        r.forEach(function (e, i) { rise(api, e, .1 + i * .15); });
        var p = centre(r[0], .5, .6);
        api.cursor.to(p[0], p[1], .6, .4); api.cursor.click(1.0);
        api.after(1.05, function () { r[0].classList.add("lit"); });
      } },
    { chapter: "did", scene: "lena", text: "I tested the game with five players and redesigned it around one player, Lena, and what she wanted: to start fast, play against someone, learn something, and enjoy the result.",
      cue: function (api) {
        rise(api, $(api.root, ".lena"), api.word("Lena,") - .4);
        var v = $$(api.root, ".verb");
        v.forEach(function (e) { rise(api, e, api.word("wanted:")); });
        ["start", "against", "learn", "enjoy"].map(function (w) { return api.word(w); }).forEach(function (d, i) {
          var p = centre(v[i], .25, .4);
          api.cursor.to(p[0], p[1], .5, d - .5); api.cursor.click(d);
          api.after(d + .05, function () { v[i].classList.add("lit"); });
        });
      } },
    { chapter: "did", scene: "rooms", text: "Rooms now feel live without anyone waiting.", hold: 1, cue: function (api) { api.cursor.hide(); } },
    { chapter: "did", scene: "play", text: "After every answer you see how the room answered and learn a fact.", hold: .8,
      cue: function (api) {
        var ph = $(api.root, "#ph"), p = centre(ph, .5, .62);
        $$(api.root, ".rise").forEach(function (e, i) { rise(api, e, .2 + i * .3); });
        api.cursor.show(); api.cursor.to(p[0], p[1], .7, .3); api.cursor.click(1.0);
        api.after(1.1, function () { swap(ph, "correct"); });
      } },
    { chapter: "did", scene: "result", text: "And your result lands the moment you finish, with exactly what you earned and why.", hold: 1.4, cue: function (api) { api.cursor.hide(); } },

    // ---- The impact
    { chapter: "impact", scene: "impact", text: "In the next month, new players finishing a game almost tripled, from 535 to 1,451.", hold: .6,
      cue: function (api) {
        $$(api.root, ".rise").slice(0, 4).forEach(function (e) { rise(api, e, .1); });
        api.after(.4, function () { $(api.root, "#b1").style.height = "100px"; });
        api.after(api.word("tripled,"), function () { $(api.root, "#b2").style.height = "271px"; });
        api.count($(api.root, "#n"), 535, 1451, 1.8, null, api.word("tripled,"));
      } },
    { chapter: "impact", text: "In testing, time to start halved and every game finished cleanly.", hold: 1.6,
      cue: function (api) {
        var m1 = $(api.root, "#m1"), m2 = $(api.root, "#m2"), a = api.word("time"), b = api.word("every");
        rise(api, m1, a - .3); api.count($(m1, ".num"), 127, 62, 1, function (v) { return "~" + Math.round(v) + "s"; }, a);
        rise(api, m2, b - .3); api.count($(m2, ".num"), 60, 100, 1, function (v) { return Math.round(v) + "%"; }, b);
      } }
  ];

  Story(document.getElementById("story"), {
    title: "Challenquiz in about a minute",
    chapters: [{ id: "problem", label: "The problem" }, { id: "did", label: "What I did" }, { id: "impact", label: "The impact" }],
    lines: lines,
    scenes: scenes
  });
})();
</script>
</body>
</html>
