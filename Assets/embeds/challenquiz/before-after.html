<style>
 /* Ground and text retuned to sit in the case-study band. --bg is the page's
    --surface-raised (#F2F2F7 / --fig-elevated in tokens.css), the same tint the
    tables and the friction chart render on; --ink and --sub are its
    --text-primary and --text-secondary. They are literals because this file is
    standalone by design and cannot read the site's custom properties — if that
    tint ever changes in tokens.css, it changes here too.

    accent, which sits on the artwork and is unaffected by the ground. */

 .layer{position:absolute;inset:0}
 .layer img{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none}
 .reveal{clip-path:inset(0 calc(100% - var(--x)) 0 0)}
 .handle{position:absolute;top:0;bottom:0;left:var(--x);width:2px;background:var(--handle);transform:translateX(-1px);pointer-events:none}
 .knob{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:38px;height:38px;border-radius:50%;background:var(--handle);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(0,0,0,.45)}
 .knob::before{content:"\2039 \203A";color:#fff;font-size:15px;font-weight:700}
 .dot{position:absolute;top:2px;left:50%;transform:translate(-50%,-50%);width:14px;height:14px;border-radius:50%;background:var(--handle);box-shadow:0 2px 6px rgba(0,0,0,.4)}
 .cap{margin-top:16px;color:var(--sub);font-size:14px}
