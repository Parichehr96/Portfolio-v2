<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="The working loop: build the shared components, ship, read the live analytics, iterate, and round again, worked directly with the founder and four developers.">
<title>ONTON — the working loop</title>
<link rel="stylesheet" href="case.css">
<script src="case.js"></script>
<style>
  /* Approach: one loop, run with a small team. A dot keeps going round; each
     stop lights as it passes. */
  .canvas { height: 250px; }
  svg.loop { position: absolute; left: 20px; top: 20px; width: 200px; height: 200px; overflow: visible; }
  .ring { fill: none; stroke: var(--pg-border); stroke-width: 2; stroke-dasharray: 3 5; }
  .trail { fill: none; stroke: var(--on-blue); stroke-width: 2.5; stroke-linecap: round; }
  .dot { fill: var(--on-blue); }
  .halo { fill: var(--on-blue); opacity: .18; }
  .node { position: absolute; transform: translate(-50%, -50%); display: grid; place-items: center; width: 38px; height: 38px; border-radius: 12px; background: #fff;
    box-shadow: 0 0 0 1px var(--pg-border); color: var(--pg-faint); transition: background .35s, color .35s, box-shadow .35s, transform .35s var(--e-out); }
  .node.on { background: var(--on-blue); color: #fff; box-shadow: none; transform: translate(-50%, -50%) scale(1.1); }
  .mid { position: absolute; left: 120px; top: 120px; transform: translate(-50%, -50%); text-align: center; font: 500 10.5px/1.35 "Figtree"; color: var(--pg-faint); }
  .mid b { display: block; font: 600 13px/1.2 "Figtree"; color: var(--pg-ink); }
  .list { position: absolute; left: 236px; top: 30px; width: 150px; display: grid; gap: 8px; }
  .st { padding: 6px 0 6px 10px; border-left: 2px solid var(--pg-border); transition: border-color .35s; }
  .st b { display: block; font: 600 12.5px/1.2 "Figtree"; color: var(--pg-muted); transition: color .35s; }
  .st small { display: block; font: 400 10.5px/1.3 "Figtree"; color: var(--pg-faint); margin-top: 2px; }
  .st.on { border-color: var(--on-blue); } .st.on b { color: var(--pg-ink); }
  .team { position: absolute; left: 412px; right: 24px; top: 34px; }
  .team .eyebrow { margin-bottom: 12px; }
  .ppl { display: flex; flex-wrap: wrap; gap: 10px 8px; }
  .p { width: 44px; text-align: center; }
  .p span { display: grid; place-items: center; width: 38px; height: 38px; margin: 0 auto; border-radius: 50%; font: 600 12px/1 "Figtree"; background: var(--pg-mist); color: var(--pg-muted); box-shadow: inset 0 0 0 1.5px var(--pg-border); transition: transform .3s var(--e-out), box-shadow .3s; }
  .p.me span { background: var(--on-blue); color: #fff; box-shadow: none; }
  .p small { display: block; margin-top: 5px; font: 500 10px/1.2 "Figtree"; color: var(--pg-faint); }
  .p.ping span { transform: translateY(-3px); box-shadow: inset 0 0 0 1.5px var(--on-blue); }
  .team .cap { margin-top: 16px; }
</style>
</head>
<body>
<div class="frame" id="f">
  <div class="canvas">
    <svg class="loop" viewBox="0 0 200 200" aria-hidden="true">
      <circle class="ring" cx="100" cy="100" r="78"/>
      <path class="trail" id="trail" d=""/>
      <circle class="halo" id="halo" r="11"/><circle class="dot" id="dot" r="5"/>
    </svg>
    <div class="mid"><b>One loop</b>after launch</div>
    <div id="nodes"></div><div class="list" id="list"></div>
    <div class="team">
      <div class="eyebrow">Worked directly with</div>
      <div class="ppl" id="ppl"></div>
      <div class="cap">The sole product designer, with the founder and four developers.</div>
    </div>
  </div>
</div>
<script>
  var IC = {
    comp: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="3.75"/></svg>',
    ship: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 3L10 14"/><path d="M21 3l-7 18-4-7-7-4 18-7z"/></svg>',
    data: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
    iter: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v4h-4"/></svg>',
  };
  /* stops at 12, 3, 6 and 9 o'clock on the ring */
  var S = [["comp", "Build components", "the shared parts it relied on", -90], ["ship", "Ship", "with the developers", 0],
           ["data", "Read live analytics", "where organizers stop", 90], ["iter", "Iterate", "change, then round again", 180]];
  var CX = 120, CY = 120, R = 78;
  document.getElementById("nodes").innerHTML = S.map(function (s, i) {
    var a = s[3] * Math.PI / 180;
    return '<div class="node" id="n' + i + '" style="left:' + (CX + Math.cos(a) * R) + "px;top:" + (CY + Math.sin(a) * R) + 'px">' + IC[s[0]] + "</div>";
  }).join("");
  document.getElementById("list").innerHTML = S.map(function (s, i) { return '<div class="st" id="s' + i + '"><b>' + s[1] + "</b><small>" + s[2] + "</small></div>"; }).join("");
  document.getElementById("ppl").innerHTML = [["Me", "design", 1], ["F", "founder"], ["D1", "dev"], ["D2", "dev"], ["D3", "dev"], ["D4", "dev"]]
    .map(function (p) { return '<div class="p' + (p[2] ? " me" : "") + '"><span>' + p[0] + "</span><small>" + p[1] + "</small></div>"; }).join("");
  var dot = document.getElementById("dot"), halo = document.getElementById("halo"), trail = document.getElementById("trail"), ppl = document.querySelectorAll(".p");
  function pt(deg) { var a = deg * Math.PI / 180; return [100 + Math.cos(a) * 78, 100 + Math.sin(a) * 78]; }
  function place(deg) {
    var p = pt(deg); dot.setAttribute("cx", p[0]); dot.setAttribute("cy", p[1]); halo.setAttribute("cx", p[0]); halo.setAttribute("cy", p[1]);
    var from = deg - 70, a = pt(from); trail.setAttribute("d", "M" + a[0] + " " + a[1] + " A78 78 0 0 1 " + p[0] + " " + p[1]);
    trail.style.opacity = 1;
    var near = ((deg + 90) % 360 + 360) % 360 / 90; /* 0 at the top stop */
    S.forEach(function (s, i) { var d = Math.abs(near - i); d = Math.min(d, 4 - d); var on = d < .32; document.getElementById("s" + i).classList.toggle("on", on); document.getElementById("n" + i).classList.toggle("on", on); });
  }
  place(-90);
  whenSeen(document.getElementById("f"), function () {
    if (END || reduced) { place(-90); return; }
    var t0 = performance.now(), LAP = 6400, lastStop = -1;
    (function f(now) {
      var deg = -90 + ((now - t0) % LAP) / LAP * 360; place(deg);
      var k = Math.floor(((deg + 90 + 15) % 360) / 90);
      if (k !== lastStop) { lastStop = k; var who = k === 1 ? [1, 2, 3, 4, 5] : k === 0 ? [0] : k === 2 ? [0, 1] : [0];
        ppl.forEach(function (p, i) { p.classList.toggle("ping", who.indexOf(i) > -1); }); }
      requestAnimationFrame(f);
    })(t0);
  });
</script>
</body>
</html>
