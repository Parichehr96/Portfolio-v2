<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="A hundred organizers create events on the essentials alone; about 15 of them open Advanced. Most never needed what the old flow forced on everyone, and the ones who did could find it.">
<title>ONTON — the 15%</title>
<link rel="stylesheet" href="case.css">
<script src="case.js"></script>
<style>
  /* Reflection: 100 organizers, one dot each. All publish on the essentials;
     the ones who opened Advanced step forward. */
  .canvas { height: 290px; }
  .grid { position: absolute; left: 40px; top: 34px; display: grid; grid-template-columns: repeat(10, 18px); gap: 6px; }
  .grid i { width: 18px; height: 18px; border-radius: 50%; background: var(--pg-mist-2); transition: background .4s, box-shadow .4s, transform .45s var(--e-out); }
  .grid i.ess { background: #B9D8FF; }
  .grid i.adv { background: var(--on-blue); box-shadow: 0 0 0 2px #fff, 0 0 0 3.5px var(--on-blue); }
  .side { position: absolute; left: 330px; right: 36px; top: 40px; }
  .side .num { font-size: 56px; color: var(--on-blue); }
  .side .h { font: 600 15px/1.3 "Figtree"; margin-top: 6px; }
  .leg { display: grid; gap: 8px; margin-top: 22px; }
  .leg div { display: flex; align-items: center; gap: 8px; font: 500 12px/1.3 "Figtree"; color: var(--pg-muted); opacity: 0; transition: opacity .5s; }
  .leg div.on { opacity: 1; }
  .leg i { width: 12px; height: 12px; border-radius: 50%; flex: none; }
  .fine { margin-top: 18px; font: 400 11px/1.4 "Figtree"; color: var(--pg-faint); }
</style>
</head>
<body>
<div class="frame" id="f">
  <div class="canvas">
    <div class="grid" id="g" aria-hidden="true"></div>
    <div class="side">
      <div class="num" id="n">0%</div>
      <div class="h">of organizers ever opened Advanced</div>
      <div class="leg">
        <div id="l1"><i style="background:#B9D8FF"></i><span><b id="n85">85</b> published on the essentials alone</span></div>
        <div id="l2"><i style="background:var(--on-blue)"></i><span>15 needed more, and found it one tap away</span></div>
      </div>
      <div class="fine">Exactly 15.4% · one dot per organizer, out of 100</div>
    </div>
  </div>
</div>
<script>
  var g = document.getElementById("g"), h = "";
  for (var i = 0; i < 100; i++) h += "<i></i>"; g.innerHTML = h;
  var dots = g.children;
  /* 15 spread through the grid, so they read as anyone rather than a block */
  var ADV = [3, 9, 14, 22, 28, 37, 41, 50, 56, 63, 69, 74, 82, 88, 95];
  whenSeen(document.getElementById("f"), async function () {
    if (END || reduced) { for (var i = 0; i < 100; i++) dots[i].className = ADV.indexOf(i) > -1 ? "adv" : "ess";
      document.getElementById("n").textContent = "15%"; document.getElementById("l1").classList.add("on"); document.getElementById("l2").classList.add("on"); return; }
    await sleep(300);
    for (var r = 0; r < 19; r++) { /* a diagonal wave: everyone publishes on the essentials */
      for (var c = 0; c < 10; c++) { var k = r - c; if (k >= 0 && k < 10) dots[k * 10 + c].className = "ess"; }
      await sleep(45);
    }
    document.getElementById("l1").classList.add("on");
    await sleep(700);
    stagger(ADV.map(function (k) { return dots[k]; }), 1400, "adv");
    count(document.getElementById("n"), 0, 15, 1500, function (v) { return Math.round(v) + "%"; });
    await sleep(1500); document.getElementById("l2").classList.add("on");
  });
</script>
</body>
</html>
