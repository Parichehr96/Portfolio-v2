<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="The ONTON case study in two minutes: the problem, what I did and the impact, told over the case's own visuals with the designer's cursor at work.">
<title>ONTON story</title>
<link rel="stylesheet" href="../story/player.css?v=12">
<style>
  /* ONTON's scenes, on the 1200 x 675 stage. Product colours as the case's
     visuals use them (v4/case.css); everything else is the page's. */
  :root { --on-blue: #007AFF; --on-blue-bg: #E5F1FF; --neg: #D53434; --pos: #008000; }

  .kicker { font: 600 14px/1 "Figtree"; letter-spacing: .04em; text-transform: uppercase; color: var(--faint); }
  .title { font: 600 46px/1.15 "Figtree"; letter-spacing: -.01em; color: var(--ink); }
  .sub { font: 500 22px/1.4 "Figtree"; color: var(--muted); }
  .abs { position: absolute; }
  .rise { opacity: 0; transform: translateY(14px); transition: opacity .5s ease, transform .6s var(--e-out); }
  .rise.in { opacity: 1; transform: none; }
  .card { background: #fff; border-radius: 18px; box-shadow: 0 1px 0 rgba(13,18,51,.04), 0 8px 24px rgba(13,18,51,.06); }
  .frame { background: #fff; border-radius: 16px; box-shadow: 0 8px 24px rgba(13,18,51,.06); overflow: hidden; }
  .frame iframe { position: static; display: block; width: 100%; height: 100%; border: 0; }
  .tag { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: 999px; font: 600 14px/1 "Figtree"; }
  .tag.neg { background: rgba(213,52,52,.1); color: var(--neg); }
  .tag.pos { background: rgba(0,128,0,.1); color: var(--pos); }

  /* Old flow: what was wrong, one fact at a time beside the form. */
  .facts { display: grid; gap: 14px; }
  .fact { display: flex; align-items: baseline; gap: 14px; }
  .fact b { font: 700 40px/1 "Figtree"; color: var(--ink); min-width: 120px; }
  .fact span { font: 500 19px/1.35 "Figtree"; color: var(--muted); }
  .steps4 { display: flex; gap: 8px; }
  .steps4 i { flex: 1; height: 44px; border-radius: 10px; background: #fff; display: grid; place-items: center; font: 600 15px/1 "Figtree"; font-style: normal; color: var(--muted);
    transition: background .4s, color .4s, opacity .4s; }
  .steps4 i.drop { background: rgba(213,52,52,.12); color: var(--neg); }
  .steps4 i.gone { opacity: .35; }

  /* What I heard: five people, two quotes, the cursor marking what matters. */
  .people { display: flex; gap: 22px; }
  .person { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 92px; }
  .person img { width: 84px; height: 84px; border-radius: 50%; object-fit: cover; background: var(--mist-2); box-shadow: 0 0 0 3px #fff; transition: box-shadow .35s; }
  .person span { font: 600 15px/1 "Figtree"; color: var(--muted); }
  .person.lit img { box-shadow: 0 0 0 3px var(--on-blue); }
  .person.lit span { color: var(--ink); }
  .note { font: 500 12px/1 "Figtree"; color: var(--faint); }
  .quote { width: 500px; padding: 28px 30px; }
  .quote p { font: 500 27px/1.4 "Figtree"; color: var(--ink); }
  .quote small { display: block; margin-top: 16px; font: 500 16px/1 "Figtree"; color: var(--faint); }
  .mark { background: linear-gradient(rgba(255, 214, 10, .55), rgba(255, 214, 10, .55)) 0 85% / calc(var(--m, 0) * 100%) 40% no-repeat; }

  /* Team. */
  .roles { display: flex; gap: 14px; }
  .role { padding: 18px 22px; font: 600 20px/1.2 "Figtree"; color: var(--muted); transition: box-shadow .3s, color .3s; }
  .role.me { color: var(--ink); }
  .role.me.lit { box-shadow: inset 0 0 0 2px var(--on-blue), 0 8px 24px rgba(13,18,51,.06); }
  .role small { display: block; margin-top: 6px; font: 500 15px/1 "Figtree"; color: var(--faint); }

  /* The 22 fields, sorted. */
  .cols { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; width: 1040px; transition: gap .6s var(--e-out); }
  .col { min-height: 196px; padding: 12px; border-radius: 14px; background: #fff; transition: background .4s; }
  .col h4 { font: 600 14px/1 "Figtree"; color: var(--muted); margin-bottom: 10px; transition: opacity .4s; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; align-content: flex-start; }
  .chip { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 11px; border-radius: 8px; background: var(--mist); font: 500 14px/1 "Figtree";
    color: var(--ink); white-space: nowrap; transition: background .3s, color .3s, box-shadow .3s, opacity .3s; }
  .chip i { width: 8px; height: 8px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px #94A3B8; }
  .chip.kept { background: var(--on-blue-bg); } .chip.kept i { background: var(--on-blue); box-shadow: none; }
  .chip.moved { background: #fff; box-shadow: inset 0 0 0 1px var(--line); }
  .chip.gone { background: transparent; color: var(--faint); text-decoration: line-through; box-shadow: inset 0 0 0 1px var(--line); }
  .chip.held { box-shadow: 0 10px 24px rgba(13,18,51,.18); background: #fff; }
  .bins { display: grid; grid-template-columns: 1.1fr 1.3fr .8fr; gap: 12px; width: 1040px; }
  .bin { min-height: 200px; padding: 14px; border-radius: 14px; background: #fff; }
  .bin h4 { display: flex; justify-content: space-between; font: 600 16px/1 "Figtree"; color: var(--ink); margin-bottom: 12px; }
  .bin h4 span { font-variant-numeric: tabular-nums; color: var(--muted); }
  .steps-pill { font: 600 18px/1 "Figtree"; color: var(--ink); }
  .steps-pill s { color: var(--faint); }

  /* The new flow: three changes, and an event duplicated by hand. */
  .changes { display: grid; gap: 14px; }
  .change { display: flex; align-items: center; gap: 12px; font: 600 24px/1.2 "Figtree"; color: var(--ink); }
  .change i { width: 28px; height: 28px; border-radius: 50%; background: var(--on-blue-bg); display: grid; place-items: center; color: var(--on-blue); font: 700 15px/1 "Figtree"; font-style: normal; }
  .event { width: 420px; padding: 16px 18px; display: flex; align-items: center; gap: 14px; transition: transform .6s var(--e-out), opacity .4s; }
  .event .poster { width: 52px; height: 52px; border-radius: 10px; background: linear-gradient(135deg, #5AC8FA, #007AFF); flex: none; }
  .event b { display: block; font: 600 18px/1.2 "Figtree"; color: var(--ink); }
  .event small { font: 500 14px/1.3 "Figtree"; color: var(--faint); }
  .dup { margin-left: auto; height: 34px; padding: 0 14px; border-radius: 9px; background: var(--on-blue-bg); color: var(--on-blue); font: 600 14px/34px "Figtree"; }

  /* Impact. */
  .metric { width: 330px; padding: 22px 24px; }
  .metric .num { font: 700 54px/1 "Figtree"; color: var(--ink); font-variant-numeric: tabular-nums; }
  .metric .lbl { margin-top: 10px; font: 500 17px/1.3 "Figtree"; color: var(--muted); }
  .metric .from { margin-top: 12px; }
  .dots { display: grid; grid-template-columns: repeat(20, 14px); gap: 6px; }
  .dots i { width: 14px; height: 14px; border-radius: 50%; background: var(--mist-2); transition: background .3s; }
  .dots i.lit { background: var(--on-blue); }
  .loop { display: flex; align-items: center; justify-content: center; gap: 18px; }
  .node { width: 250px; min-height: 120px; padding: 22px; display: flex; flex-direction: column; justify-content: space-between; gap: 14px; }
  .node b { font: 600 21px/1.3 "Figtree"; color: var(--ink); }
  .mini-btn { align-self: flex-start; height: 36px; padding: 0 14px; border-radius: 10px; background: var(--on-blue); color: #fff; font: 600 15px/36px "Figtree"; transition: background .3s; }
  .mini-btn.done { background: #008000; }
  .arr { width: 44px; height: 2px; background: var(--on-blue); position: relative; }
  .arr::after { content: ""; position: absolute; right: -2px; top: -5px; border: 6px solid transparent; border-left: 9px solid var(--on-blue); border-right: 0; }
  .back { display: flex; gap: 8px; margin-top: 14px; }
  .back i { width: 18px; height: 18px; border-radius: 50%; background: var(--mist-2); transition: background .3s; }
  .back i.lit { background: var(--on-blue); }
  .back.big { margin-top: 0; }
  .back.big i { width: 26px; height: 26px; }
  .dau { font: 700 84px/1 "Figtree"; color: var(--ink); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }

  /* Close. */
  .claim { width: 860px; font: 600 44px/1.25 "Figtree"; color: var(--faint); text-align: center; }
  .claim span { transition: color .5s; }
  .claim span.lit { color: var(--ink); }
  .publish { height: 54px; padding: 0 28px; border-radius: 999px; background: var(--ink); color: #fff; font: 600 19px/54px "Figtree"; transition: background .3s; }
  .publish.done { background: var(--pos); }
</style>
</head>
<body>
<div id="story"></div>
<script src="../story/player.js?v=12"></script>
<script>
(function () {
  "use strict";

  // Stage coordinates of an element (for the cursor).
  function at(el) {
    var s = document.querySelector(".stage").getBoundingClientRect(), r = el.getBoundingClientRect(), k = 1200 / s.width;
    return { x: (r.left - s.left) * k, y: (r.top - s.top) * k, w: r.width * k, h: r.height * k };
  }
  function centre(el, dx, dy) { var p = at(el); return [p.x + p.w * (dx == null ? .5 : dx), p.y + p.h * (dy == null ? .5 : dy)]; }
  function put(root, html, x, y, w, h) {
    var d = document.createElement("div");
    d.className = "abs";
    d.style.left = x + "px"; d.style.top = y + "px";
    if (w) d.style.width = w + "px";
    if (h) d.style.height = h + "px";
    d.innerHTML = html;
    root.appendChild(d);
    return d;
  }
  function frame(root, src, x, y, w, h) { return put(root, '<div class="frame" style="width:' + w + 'px;height:' + h + 'px"><iframe src="' + src + '" title="" tabindex="-1" loading="eager"></iframe></div>', x, y); }
  function rise(api, el, delay) { api.after(delay || 0, function () { el.classList.add("in"); }); }
  function $(root, q) { return root.querySelector(q); }
  function $$(root, q) { return Array.prototype.slice.call(root.querySelectorAll(q)); }

  // The old flow's 22 fields (v4/sorted.html), and where each ended up.
  var FIELDS = [
    ["General", [["Name", "kept"], ["TON Hub", "moved"], ["Description", "moved"], ["Cover image", "kept"], ["Category", "moved"], ["Subtitle (mandatory)", "gone"]]],
    ["Time / Location", [["Date & time", "kept"], ["Country / City / Map", "kept"], ["Timezone (auto)", "gone"], ["In-person / Online", "kept"], ["Duration", "moved"]]],
    ["Registration", [["Capacity", "kept"], ["Registration form", "moved"], ["Ticket details", "moved"], ["Free / Paid", "kept"], ["Approval", "moved"], ["Recipient wallet", "moved"]]],
    ["Reward", [["SBT preset", "kept"], ["Custom SBT", "moved"], ["Reward video", "moved"], ["Reward image", "kept"], ["Event password", "moved"]]]
  ];

  var scenes = {
    // ONTON, and the promise it makes.
    hook: function (root, api) {
      put(root, '<p class="kicker rise">ONTON · Telegram Mini App</p><h2 class="title rise" style="margin-top:18px">Events for crypto communities, with an on-chain badge for showing up.</h2><p class="sub rise" style="margin-top:22px">But organizers kept giving up before they ever published one.</p>', 80, 150, 500);
      frame(root, "v4/promise.html?play", 620, 200, 520, 232);
      $$(root, ".rise").slice(0, 2).forEach(function (e, i) { rise(api, e, .2 + i * .35); });
    },
    // The old form filling up beside the facts.
    // Why creation matters: every user arrives through an event, and
    // organizers coming back keep them.
    growth: function (root, api) {
      put(root, '<p class="kicker" style="text-align:center">How ONTON grows</p>', 300, 110, 600);
      put(root, '<div class="loop">' +
        '<div class="card node rise" id="n1"><b>An organizer creates an event</b><span class="mini-btn">Create event</span></div><i class="arr rise"></i>' +
        '<div class="card node rise" id="n2"><b>Guests join and show up</b></div><i class="arr rise"></i>' +
        '<div class="card node rise" id="n3"><b>New users for ONTON</b></div></div>', 0, 210, 1200);
      put(root, '<svg class="return rise" id="ret" width="840" height="120" viewBox="0 0 840 120" fill="none"><path d="M760 6 C760 96 80 96 80 6" stroke="#007AFF" stroke-width="2.5" stroke-dasharray="6 7" stroke-linecap="round"/><path d="M70 18 80 4 92 16" stroke="#007AFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
        '<p class="sub rise" id="retl" style="text-align:center;margin-top:-6px">…and when organizers come back, users stay</p>', 180, 360, 840);
    },
    old: function (root, api) {
      frame(root, "v4/oldflow.html?play", 60, 70, 560, 430);
      put(root, '<p class="kicker">Creating one event, before</p>' +
        '<div class="facts" style="margin-top:22px">' +
        '<div class="fact rise"><b>4</b><span>dense steps</span></div>' +
        '<div class="fact rise"><b>20+</b><span>fields</span></div>' +
        '<div class="fact rise"><b style="font-size:30px">⚠︎</b><span>“Cannot be changed after creation”, on almost every screen</span></div>' +
        '<div class="fact rise"><b>~7</b><span>minutes</span></div></div>' +
        '<div class="rise" style="margin-top:30px"><p class="kicker" style="margin-bottom:12px">Where organizers left</p><div class="steps4"><i>Step 1</i><i>Step 2</i><i>Step 3</i><i>Step 4</i></div></div>', 680, 90, 460);
    },
    heard: function (root, api) {
      // Five organizers, interviewed. Isabel and Malena are the case study's
      // own; all names are changed and the portraits are AI illustrations.
      var who = [["isabel", "Isabel"], ["malena", "Malena"], ["kenji", "Kenji"], ["omar", "Omar"], ["sofie", "Sofie"]];
      put(root, '<p class="kicker">Five organizers, interviewed</p><div class="people" style="margin-top:18px">' +
        who.map(function (w) { return '<span class="person rise" data-who="' + w[0] + '"><img src="story-img/' + w[0] + '.jpg" alt="" width="84" height="84"><span>' + w[1] + '</span></span>'; }).join("") +
        '</div><p class="note rise" style="margin-top:14px">Names changed · portraits are illustrations</p>', 80, 46, 620);
      put(root, '<div class="card quote rise" id="q1"><p>“I didn’t even know what I was <span class="mark">being asked to decide</span>.”</p><small>Isabel · first-time organizer</small></div>', 80, 250);
      put(root, '<div class="card quote rise" id="q2"><p>“I rebuild the same event from scratch <span class="mark">every week</span>.”</p><small>Malena · weekly organizer</small></div>', 620, 250);
      put(root, '<p class="sub rise" id="halves">Over-asked, then asked all over again.</p>', 80, 470, 500);
    },
    sort: function (root, api) {
      var cols = FIELDS.map(function (g, i) {
        return '<div class="col"><h4>Step ' + (i + 1) + ' · ' + g[0] + '</h4><div class="chips">' +
          g[1].map(function (f) { return '<span class="chip" data-st="' + f[1] + '"><i></i>' + f[0] + '</span>'; }).join("") + "</div></div>";
      }).join("");
      put(root, '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px"><p class="kicker">The old flow’s 22 fields</p><p class="steps-pill" id="pill"><s>4 steps</s></p></div><div class="cols">' + cols + "</div>", 80, 40, 1040);
      put(root, '<div class="bins"><div class="bin" data-bin="kept"><h4>Up front <span>0</span></h4><div class="chips"></div></div>' +
        '<div class="bin" data-bin="moved"><h4>Advanced <span>0</span></h4><div class="chips"></div></div>' +
        '<div class="bin" data-bin="gone"><h4>Removed or automated <span>0</span></h4><div class="chips"></div></div></div>', 80, 380, 1040);
    },
    newflow: function (root, api) {
      put(root, '<p class="kicker">The new flow</p><div class="changes" style="margin-top:22px">' +
        '<div class="change rise"><i>1</i>Defaults that stick</div><div class="change rise"><i>2</i>Duplicate any event</div><div class="change rise"><i>3</i>One confirmation, at the end</div></div>', 80, 90, 470);
      put(root, '<div class="card event" id="ev1"><span class="poster"></span><div><b>Weekly TON meetup</b><small>Thu · 19:00 · Berlin</small></div><span class="dup">Duplicate</span></div>' +
        '<div class="card event" id="ev2" style="margin-top:12px;opacity:0;transform:translateY(-20px)"><span class="poster"></span><div><b>Weekly TON meetup</b><small>Next Thu · 19:00 · Berlin</small></div></div>', 80, 360);
      frame(root, "hero-animation.html", 600, 120, 540, 354);
    },
    // The results, as the earlier cut drew them: cards with their change in
    // green, and daily users large beside them.
    impact: function (root, api) {
      put(root, '<div style="display:flex;gap:20px">' +
        '<div class="card metric rise" id="m1"><div class="num">4</div><div class="lbl">Steps to create an event</div><div class="from"><span class="tag pos">from 4 steps</span></div></div>' +
        '<div class="card metric rise" id="m2"><div class="num">~7 min</div><div class="lbl">Time to create an event</div><div class="from"><span class="tag pos">−86%</span></div></div>' +
        '<div class="card metric rise" id="m3"><div class="num">20%</div><div class="lbl">Event-creation completion</div><div class="from"><span class="tag pos">from 20%</span></div></div></div>', 80, 60);
      put(root, '<div class="card rise" id="m4" style="padding:22px 24px;width:450px"><div style="display:flex;align-items:center;gap:18px"><span class="num" style="font:700 54px/1 Figtree;color:var(--ink);font-variant-numeric:tabular-nums">2 / 5</span><div class="back big"><i></i><i></i><i></i><i></i><i></i></div></div>' +
        '<p style="margin-top:12px;font:500 17px/1.3 Figtree;color:var(--muted)">Organizers who came back</p><div class="from" style="margin-top:12px"><span class="tag pos">from 2 / 5</span></div></div>', 80, 330);
      put(root, '<div class="rise" id="m5"><p class="kicker">Daily active users</p><p class="dau" style="margin-top:12px"><span id="dau">87</span></p><p class="sub" style="margin-top:8px">from 87</p></div>', 600, 360, 520);
    }
  };

  var lines = [
    // ---- The problem
    { chapter: "problem", scene: "hook", text: "ONTON is an event app for crypto communities on Telegram, and guests get an on-chain badge for showing up." },
    { chapter: "problem", scene: "growth", text: "Every new user arrives through an event, so when organizers create more events, the app grows, and when they come back, it keeps its users.",
      cue: function (api) {
        var n = $$(api.root, ".node"), a = $$(api.root, ".arr"), btn = $(api.root, ".mini-btn"), p = centre(btn);
        rise(api, n[0], .1);
        api.cursor.show(); api.cursor.to(p[0], p[1], .8, .4); api.cursor.click(1.3);
        api.after(1.35, function () { btn.classList.add("done"); btn.textContent = "Created ✓"; });
        rise(api, a[0], 1.6); rise(api, n[1], 1.9); rise(api, a[1], 2.5); rise(api, n[2], api.word("grows,") - .3);
        rise(api, $(api.root, "#ret"), api.word("come")); rise(api, $(api.root, "#retl"), api.word("come") + .3);
        api.after(2.4, function () { api.cursor.hide(); });
      } },
    { chapter: "problem", scene: "old", text: "But creating one had grown into four long steps, more than twenty fields, and a warning on almost every screen.",
      cue: function (api) {
        var f = $$(api.root, ".fact");
        rise(api, f[0], api.word("four")); rise(api, f[1], api.word("twenty")); rise(api, f[2], api.word("warning"));
        api.cursor.show();
        api.cursor.to(330, 260, 1.0, .2); api.cursor.to(260, 330, .8, 1.6); api.cursor.to(420, 300, 1.0, 2.8); api.cursor.to(300, 420, 1.1, 4.2);
      } },
    { chapter: "problem", text: "It took about seven minutes, and most organizers gave up halfway.",
      cue: function (api) {
        rise(api, $$(api.root, ".fact")[3], .2);
        var box = $$(api.root, ".rise")[4], st = $$(api.root, ".steps4 i");
        rise(api, box, api.word("most"));
        api.after(api.word("gave"), function () { st[1].classList.add("drop"); st[2].classList.add("drop"); });
        api.after(api.word("halfway."), function () { st[3].classList.add("gone"); });
        api.cursor.hide();
      } },

    // ---- What I did
    { chapter: "did", scene: "heard", text: "I talked to five organizers and heard the same story: they were asked for things they didn’t need, and asked again every week.", hold: .3,
      cue: function (api) {
        $$(api.root, ".person").forEach(function (p, i) { rise(api, p, .2 + i * .2); });
        rise(api, $(api.root, ".note"), 1.3);
        var q1 = $(api.root, "#q1"), q2 = $(api.root, "#q2"), m = $$(api.root, ".mark"), t1 = api.word("asked"), t2 = api.word("asked", 2);
        rise(api, q1, t1 - .4);
        api.after(t1 - .4, function () { $(api.root, '[data-who="isabel"]').classList.add("lit"); });
        api.cursor.show();
        var a = centre(m[0], 0, .7), b = centre(m[0], 1, .7);
        api.cursor.to(a[0], a[1], .6, t1 - .3);
        api.tween(1, function (p) { m[0].style.setProperty("--m", p); }, t1 + .3);
        api.cursor.to(b[0], b[1], 1, t1 + .3);
        rise(api, q2, t2 - .5);
        api.after(t2 - .5, function () { $(api.root, '[data-who="isabel"]').classList.remove("lit"); $(api.root, '[data-who="malena"]').classList.add("lit"); });
        var c = centre(m[1], 0, .7), d = centre(m[1], 1, .7);
        api.cursor.to(c[0], c[1], .6, t2 - .3);
        api.tween(.8, function (p) { m[1].style.setProperty("--m", p); }, t2 + .3);
        api.cursor.to(d[0], d[1], .8, t2 + .3);
        rise(api, $(api.root, "#halves"), t2 + 1.2);
      } },
    { chapter: "did", scene: "sort", text: "So I sorted all 22 fields.", hold: 1.2,
      cue: function (api) {
        var bin = $(api.root, '[data-bin="moved"] .chips');
        function carry(name, d) {
          var chip = $$(api.root, ".cols .chip").filter(function (c) { return c.textContent === name; })[0];
          var from = centre(chip, .3, .5), to = centre(bin, .2, .3);
          api.cursor.to(from[0], from[1], .6, d);
          api.cursor.grab(chip, d + .65);
          api.cursor.to(to[0] + 40, to[1] + 6, .8, d + .7);
