     hero H1, replacing live text that had been set in Figtree. Exported from
     the Portfolio file at its comp size, 259 x 59.
     fill=currentColor, not #040404: it is inside an <h1> and has to take that
     heading's colour, including anywhere the hero palette flips.
     NO width/height on the root — _hero.css sizes it in em off the display
     step so it scales with the heading. The viewBox is the contract: at the
     57px display step it renders 259 x 59, which is 1:1 with the comp's own
     258-wide text node (184:13342). The word's optical baseline sits around
     y=46-47.6 of the 59 (it is handwriting, so the letters bounce rather than
     sit on one rigid line); --designer-nudge in tokens.css carries the offset
     that lands it level with "Product", and was measured against the rendered
     page rather than derived from these numbers. -->
